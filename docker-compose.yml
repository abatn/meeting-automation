version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting_db
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - postgres
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    user: "0:0"
    hostname: rabbitmq
    command: >
      sh -c "
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
        rabbitmq-server
      "
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_password
      RABBITMQ_ERLANG_COOKIE: "fixed_wsl2_cookie_123"
      RABBITMQ_NODENAME: rabbit@localhost
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: 
          memory: 2G
          cpus: '1.0'

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
  
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=meeting_db
      - DB_POSTGRESDB_USER=meeting_user
      - DB_POSTGRESDB_PASSWORD=meeting_password
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_SECRET:-super_secret_jwt_key_onlyoffice_2026}
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
    ports:
      - "8080:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 10s for PostgreSQL...' &&
      sleep 10 &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio_user
      - S3_SECRET_KEY=minio_password
      - ONLYOFFICE_SECRET=${ONLYOFFICE_SECRET:-super_secret_jwt_key_onlyoffice_2026}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-http://localhost:8080}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 10s for RabbitMQ...' &&
      sleep 10 &&
      celery -A app.tasks.celery_app worker --loglevel=info
      "
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 15s for Backend...' &&
      sleep 15 &&
      celery -A app.tasks.celery_app beat --loglevel=info
      "
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: meeting-automation-frontend:v1.0.0
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  n8n_data:
  onlyoffice_data:
