version: '3.8'

# ============================================================
# LOCAL DEVELOPMENT ONLY
# ============================================================
# This compose file is for local development on a single machine.
# All services run in Docker containers.
# For staging: use K8s (k3s) — LiveKit und MinIO sind im Cluster
# For E2E tests: use docker-compose.e2e.yml
# ============================================================

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting_db
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    user: "0:0"
    hostname: rabbitmq
    command: >
      sh -c "
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
        rabbitmq-server
      "
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_password
      RABBITMQ_ERLANG_COOKIE: "fixed_wsl2_cookie_123"
      RABBITMQ_NODENAME: rabbit@localhost
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=false
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=meeting_db
      - DB_POSTGRESDB_USER=meeting_user
      - DB_POSTGRESDB_PASSWORD=meeting_password
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    hostname: "${HOST_IP:-localhost}"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_SECRET:-super_secret_jwt_key_onlyoffice_2026}
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - SERVER_NAME=${HOST_IP:-localhost}
      - AMQP_URI=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
      - AMQP_TYPE=rabbitmq
    ports:
      - "8081:80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 10s for PostgreSQL...' &&
      sleep 10 &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    env_file: .env
    environment:
      - APP_ROLE=backend
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minio_user
      - S3_SECRET_KEY=minio_password
      - ONLYOFFICE_SECRET=${ONLYOFFICE_SECRET:-super_secret_jwt_key_onlyoffice_2026}
      - ONLYOFFICE_URL=http://${HOST_IP:-localhost}:8081
      - PUBLIC_BACKEND_URL=http://backend:8000
      - N8N_WEBHOOK_MEETING_CREATED=http://n8n:5678/webhook/meeting-created
      - ENCRYPTION_KEY=6AfRJonLMRY0ZXZ7W6rmFISWHurdK_AfQ1vjK2WZ3t4=
      - TOTP_ENCRYPTION_KEY=MWF5UYgUBBiaPQB-tRw5hoCA_CGsQxDUnYVYFtiMsK4=
      - INTERNAL_API_SECRET=super-secret-automation-key-2026
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      - LIVEKIT_NGROK_URL=${LIVEKIT_NGROK_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-meeting-api-key-2026}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-meeting-api-secret-2026-meeting-automation-staging}
      - LIVEKIT_EGRESS_BUCKET=meeting-recordings
      - LIVEKIT_EGRESS_S3_ENDPOINT=http://localhost:9000
      - GLADIA_API_KEY=${GLADIA_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G

  celery-worker:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 10s for RabbitMQ...' &&
      sleep 10 &&
      celery -A app.tasks.celery_app worker --loglevel=info --queues=transcription,email,maintenance --concurrency=2 --max-tasks-per-child=5
      "
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
      - ENCRYPTION_KEY=6AfRJonLMRY0ZXZ7W6rmFISWHurdK_AfQ1vjK2WZ3t4=
      - TOTP_ENCRYPTION_KEY=MWF5UYgUBBiaPQB-tRw5hoCA_CGsQxDUnYVYFtiMsK4=
      - INTERNAL_API_SECRET=super-secret-automation-key-2026
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2G

  celery-beat:
    build: ./backend
    restart: unless-stopped
    command: >
      bash -c "
      echo 'Waiting 15s for Backend...' &&
      sleep 15 &&
      celery -A app.tasks.celery_app beat --loglevel=info
      "
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres/meeting_db
      - REDIS_URL=redis://default:redis_password@redis:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq:5672/
      - ENCRYPTION_KEY=6AfRJonLMRY0ZXZ7W6rmFISWHurdK_AfQ1vjK2WZ3t4=
      - TOTP_ENCRYPTION_KEY=MWF5UYgUBBiaPQB-tRw5hoCA_CGsQxDUnYVYFtiMsK4=
      - INTERNAL_API_SECRET=super-secret-automation-key-2026
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: meeting-automation-frontend:v1.0.0
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  livekit-server:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    volumes:
      # Webhook URL: port 8000 (local backend port). Staging uses entrypoint with LIVEKIT_WEBHOOK_PORT=8080.
      - ./livekit-host.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7880"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  livekit-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - livekit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - EGRESS_CONFIG_FILE=/etc/livekit-egress/config.yaml
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-meeting-api-key-2026}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-meeting-api-secret-2026-meeting-automation-staging}
      - LIVEKIT_WS_URL=ws://localhost:7880
    volumes:
      - ./livekit-egress.yaml:/etc/livekit-egress/config.yaml:ro
    depends_on:
      livekit-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  n8n_data:
  onlyoffice_data:
  livekit-redis-data:
