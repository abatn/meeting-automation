# ============================================================
# E2E TESTS ONLY
# ============================================================
# Isolated test environment with separate database.
# LiveKit runs in k3s cluster (no host-side docker-compose needed)
# ============================================================

services:
  postgres-test:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meeting_db_test
      POSTGRES_USER: meeting_user
      POSTGRES_PASSWORD: meeting_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting_user -d meeting_db_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network

  redis-test:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass redis_password
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - e2e-network

  rabbitmq-test:
    image: rabbitmq:3-management
    restart: unless-stopped
    user: "0:0"
    hostname: rabbitmq-test
    command: >
      sh -c "
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq &&
        rabbitmq-server
      "
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_user
      RABBITMQ_DEFAULT_PASS: rabbit_password
      RABBITMQ_ERLANG_COOKIE: "fixed_wsl2_cookie_123"
      RABBITMQ_NODENAME: rabbit@localhost
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_test_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
    networks:
      - e2e-network

  minio-test:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - e2e-network

  onlyoffice-test:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=test_secret_onlyoffice_2026
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
    ports:
      - "8081:80"
    volumes:
      - onlyoffice_test_data:/var/www/onlyoffice/Data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - e2e-network

  backend:
    build:
      context: ./backend
      args:
        E2E_BUILD: "true"
    container_name: meeting-automation-backend-e2e
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    extra_hosts:
      - "livekit-server:host-gateway"
    environment:
      - PYTHONPATH=/app
      - APP_ROLE=backend
      - E2E_TEST=true
      - DB_HOST=postgres-test
      - DB_NAME=meeting_db_test
      - DB_PASSWORD=meeting_password
      - RUN_MIGRATIONS=true
      - DATABASE_URL=postgresql+asyncpg://meeting_user:meeting_password@postgres-test:5432/meeting_db_test
      - REDIS_URL=redis://:redis_password@redis-test:6379/0
      - CELERY_BROKER_URL=amqp://rabbit_user:rabbit_password@rabbitmq-test:5672/
      - CELERY_RESULT_BACKEND=redis://:redis_password@redis-test:6379/2
      - S3_ENDPOINT=http://minio-test:9000
      - S3_ACCESS_KEY=minio_user
      - S3_SECRET_KEY=minio_password
      - ONLYOFFICE_SECRET=test_secret_onlyoffice_2026
      - ONLYOFFICE_URL=http://onlyoffice-test:80
      - N8N_WEBHOOK_URL=http://n8n-test:5678/webhook
      - SECRET_KEY=test-secret-key-for-e2e-only
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - GLADIA_API_KEY=${GLADIA_API_KEY:-}
      - DEBUG=true
      - ENCRYPTION_KEY=6AfRJonLMRY0ZXZ7W6rmFISWHurdK_AfQ1vjK2WZ3t4=
      - TOTP_ENCRYPTION_KEY=MWF5UYgUBBiaPQB-tRw5hoCA_CGsQxDUnYVYFtiMsK4=
      - INTERNAL_API_SECRET=test-internal-api-secret-key-2026
      - LIVEKIT_URL=ws://livekit-server:7880
      - LIVEKIT_PUBLIC_URL=ws://livekit-server:7880
      - LIVEKIT_API_KEY=meeting-api-key-2026
      - LIVEKIT_API_SECRET=meeting-api-secret-2026-meeting-automation-staging
      - LIVEKIT_EGRESS_BUCKET=meeting-recordings
      - LIVEKIT_EGRESS_S3_ENDPOINT=http://localhost:9000
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ./:/workspace
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      rabbitmq-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      onlyoffice-test:
        condition: service_healthy
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge

volumes:
  postgres_test_data:
  redis_test_data:
  rabbitmq_test_data:
  minio_test_data:
  onlyoffice_test_data:
