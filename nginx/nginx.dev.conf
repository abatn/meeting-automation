server {
    listen 8080;
    server_name localhost 158.180.18.110;

    # Frontend (React SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-ID $http_x_client_id;  # Forward X-Client-ID header
        
        # CRITICAL: Transform cookie path from /api/ to / so browser sends it on all requests
        proxy_cookie_path /api/ /;
        # NOTE: Do NOT force secure=true on HTTP dev environment
        # Backend already sets correct flags (httponly, samesite=lax, path=/)
    }

    # Health check for nginx
    location /health {
        return 200 'nginx OK';
        add_header Content-Type text/plain;
    }
}