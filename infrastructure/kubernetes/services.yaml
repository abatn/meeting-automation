apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: meeting-automation
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: meeting-automation
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: meeting-automation
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: management
    port: 15672
    targetPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: meeting-automation
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: meeting-automation
spec:
  selector:
    app: n8n
  ports:
  - port: 5678
    targetPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: meeting-automation
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: meeting-automation
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
