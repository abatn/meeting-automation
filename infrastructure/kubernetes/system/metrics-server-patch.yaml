# Metrics-Server Patch for OCI Staging
# Phase 189: OCI VNIC blocks pod→node traffic on port 10250
# Fix: hostNetwork=true + secure-port=4443 + EndpointSlice
#
# FIX 2026-09-12 (root cause of "KEDA never scales"): the Service targetPort
# below pointed at the stale port name "https" (=10250, kubelet) instead of
# "https-metrics" (=4443, metrics-server itself). Endpoints resolved to
# nodeIP:10250 → metrics API 404 → APIService Available=False →
# HPA FailedGetResourceMetric → no CPU metrics → KEDA could never scale out.
# Live fix verified 2026-09-12: targetPort https-metrics → Endpoints 4443 →
# APIService Available=True, kubectl top works, HPA cpu: 0%/80% real value.
#
# Usage: kubectl apply -f infrastructure/kubernetes/system/metrics-server-patch.yaml
# (EndpointSlice workaround NOT needed anymore — see
#  infrastructure/kubernetes/staging/apply-metrics-endpointslice.sh header)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  template:
    spec:
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: metrics-server
        args:
        - --cert-dir=/tmp
        - --secure-port=4443
        - --kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname
        - --kubelet-use-node-status-port
        - --metric-resolution=15s
        - --tls-cipher-suites=TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
        ports:
        - name: https-metrics
          containerPort: 4443
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: 4443
            scheme: HTTPS
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 4443
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
---
# Service: port 4443 (matches --secure-port)
# FIX 2026-09-12: targetPort was "https" (leftover port name -> 10250/kubelet).
# Endpoints pointed at 10.0.0.191:10250 (kubelet) -> aggregator got 404 ->
# APIService Available=False -> HPA FailedGetResourceMetric -> KEDA never scaled.
# Correct targetPort is the named container port "https-metrics" (4443).
apiVersion: v1
kind: Service
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  ports:
  - name: https-metrics
    port: 4443
    targetPort: https-metrics
    protocol: TCP
---
# APIService: insecureSkipTLSVerify=true (consistent with k3s built-in)
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
spec:
  service:
    name: metrics-server
    namespace: kube-system
    port: 4443
  group: metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
