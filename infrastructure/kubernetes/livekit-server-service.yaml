apiVersion: v1
kind: Service
metadata:
  name: livekit-server
  namespace: meeting-automation
spec:
  selector:
    app: livekit-server
  ports:
  - name: signaling
    port: 7880
    targetPort: 7880
    protocol: TCP
  - name: tcp-fallback
    port: 7881
    targetPort: 7881
    protocol: TCP
  type: ClusterIP
