apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: meeting-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: alembic-migrate
        image: meeting-automation-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "export PYTHONPATH=/app && cd /app && alembic upgrade head"]
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
        env:
        - name: DB_HOST
          value: "postgres"
        - name: RUN_MIGRATIONS
          value: "true"
        - name: E2E_TEST
          value: "false"
      containers:
      - name: backend
        image: meeting-automation-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
        env:
        - name: PYTHONPATH
          value: "/app"
