apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: meeting-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-repo/meeting-automation-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config