apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: meeting-automation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-repo/meeting-automation-frontend:latest
        ports:
        - containerPort: 80