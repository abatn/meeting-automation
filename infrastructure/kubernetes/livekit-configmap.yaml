apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: meeting-automation
data:
  livekit.yaml: |
    port: 7880
    rtc:
      tcp_port: 7881
      use_external_ip: true
      port_range_start: 7881
      port_range_end: 7890
    keys:
      meeting-api-key: meeting-api-secret-2026
    logging:
      level: info
    redis:
      address: redis:6379
      password: redis_password_prod
      db: 0
    webhook:
      api_key: meeting-api-key
      urls:
        - http://backend:8000/api/v1/livekit/webhooks
  livekit-egress.yaml: |
    log_level: debug
    insecure: true
    redis:
      address: redis:6379
      password: redis_password_prod
      db: 0
    storage:
      s3:
        access_key: __MINIO_USER__
        secret: __MINIO_PASS__
        endpoint: http://minio:9000
        bucket: meeting-recordings
        region: us-east-1
    health_port: 7000
    template_port: 7980
    prometheus_port: 7001
    cpu_cost:
      room_composite_cpu_cost: 1.5
      web_cpu_cost: 1.5
      track_composite_cpu_cost: 1.0
      track_cpu_cost: 0.5
  livekit-entrypoint.sh: |
    #!/bin/sh
    set -eu
    if [ -z "${LIVEKIT_API_KEY:-}" ] || [ -z "${LIVEKIT_API_SECRET:-}" ]; then
      echo "[LiveKit-Server] LIVEKIT_API_KEY and LIVEKIT_API_SECRET are required" >&2
      exit 1
    fi
    escape_sed_replacement() {
      printf '%s' "$1" | sed 's/[\/&|\\]/\\&/g'
    }
    if [ -n "${LIVEKIT_NODE_IP:-}" ]; then
      NODE_IP="$LIVEKIT_NODE_IP"
    else
      NODE_IP=$(hostname -i 2>/dev/null | awk '{print $1}' || echo "127.0.0.1")
    fi
    echo "[LiveKit-Server] Detected IP: $NODE_IP"
    LIVEKIT_API_KEY_ESC=$(escape_sed_replacement "$LIVEKIT_API_KEY")
    LIVEKIT_API_SECRET_ESC=$(escape_sed_replacement "$LIVEKIT_API_SECRET")
    sed \
      -e "s/__LIVEKIT_API_KEY__/${LIVEKIT_API_KEY_ESC}/g" \
      -e "s/__LIVEKIT_API_SECRET__/${LIVEKIT_API_SECRET_ESC}/g" \
      /etc/livekit.yaml > /tmp/livekit.yaml
    exec /livekit-server --config /tmp/livekit.yaml --node-ip "$NODE_IP"
