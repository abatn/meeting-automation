apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: meeting-automation
  labels:
    app: onlyoffice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
      initContainers:
      - name: init-oo-config
        image: onlyoffice/documentserver:9.4.0
        imagePullPolicy: Always
        command: ['sh', '-c', 'cp /config-source/local.json /emptydir-writable/local.json && cp /config-source/ds-docservice.conf /emptydir-writable/ds-docservice.conf && chmod 644 /emptydir-writable/local.json /emptydir-writable/ds-docservice.conf']
        volumeMounts:
        - name: configmap-source
          mountPath: /config-source
          readOnly: true
        - name: onlyoffice-config-writable
          mountPath: /emptydir-writable
      containers:
      - name: onlyoffice
        image: onlyoffice/documentserver:9.4.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: JWT_ENABLED
          value: "true"
        - name: JWT_SECRET
          value: "tHjRho7Mrgicb9g09trClzCPt9X5OI48ZIfGWILLnkQ"
        - name: JWT_HEADER
          value: "Authorization"
        - name: ALLOW_PRIVATE_IP_ADDRESS
          value: "true"
        - name: SECURE_LINK_SECRET
          value: "prod-onlyoffice-secure-link-2026"
        - name: SERVER_NAME
          value: "meeting-automation.com"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: onlyoffice-config-writable
          mountPath: /etc/onlyoffice/documentserver/local.json
          subPath: local.json
        - name: onlyoffice-config-writable
          mountPath: /etc/onlyoffice/documentserver/nginx/includes/ds-docservice.conf
          subPath: ds-docservice.conf
      volumes:
      - name: configmap-source
        configMap:
          name: onlyoffice-custom-config
      - name: onlyoffice-config-writable
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: meeting-automation
  labels:
    app: onlyoffice
spec:
  selector:
    app: onlyoffice
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
