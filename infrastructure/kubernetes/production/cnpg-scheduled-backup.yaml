# CloudNativePG ScheduledBackup — erstellt Base-Backups
# Die Retention (7d) ist auf der Cluster CRD konfiguriert
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: daily-backup
  namespace: meeting-automation
spec:
  schedule: "0 0 3 * * *"         # 6 Felder (täglich 03:00 UTC)
  immediate: true                 # Erstes Backup sofort
  backupOwnerReference: self
  cluster:
    name: meeting-db
  method: barmanObjectStore
