apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-gratuit
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: celery-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: transcription_gratuit
        mode: QueueLength
        value: "5"
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: email
        mode: QueueLength
        value: "1"
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: maintenance
        mode: QueueLength
        value: "1"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-pro
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: celery-worker-pro
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: transcription_pro
        mode: QueueLength
        value: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: livekit-egress
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: livekit-egress
  minReplicaCount: 1
  maxReplicaCount: 1        # hostNetwork: 1 pod/node. Raise to 5 ONLY together with the
                            # scaling activation (hostNetwork=false) once the prod
                            # kube-router pod->redis rejection for new pods is solved
                            # (see docs/EGRESS_SCALING_SOLUTION_2026-09-11.md §7)
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
