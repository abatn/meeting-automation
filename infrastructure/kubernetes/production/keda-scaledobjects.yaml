apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-gratuit
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: celery-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: transcription_gratuit
        mode: QueueLength
        value: "5"
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: email
        mode: QueueLength
        value: "1"
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: maintenance
        mode: QueueLength
        value: "1"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-pro
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: celery-worker-pro
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      metadata:
        host: amqp://rabbit_user:${RABBIT_PASS}@rabbitmq.meeting-automation.svc.cluster.local:5672//
        queueName: transcription_pro
        mode: QueueLength
        value: "5"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: livekit-egress
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: livekit-egress
  minReplicaCount: 1
  maxReplicaCount: 5        # Raised 2026-09-12 after canary 2.4 passed: egress runs on
                            # pod-network (hostNetwork=false), NetworkPolicies fixed,
                            # full pipeline green (pipeline_total=85.26s). Next step:
                            # trigger upgrade to livekit_egress_available (CPU trigger is
                            # blind for audio-only recordings — see
                            # docs/EGRESS_SCALING_VICTORIAMETRICS_KEDA_2026-09-12.md)
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"
