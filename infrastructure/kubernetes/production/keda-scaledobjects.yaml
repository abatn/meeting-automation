---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: livekit-egress
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: livekit-egress
  minReplicaCount: 1        # Mindestens 1 (Recording immer moeglich)
  maxReplicaCount: 5        # Dynamisch basiert auf CPU
  pollingInterval: 30
  cooldownPeriod: 120
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"         # Bei 80% CPU skaliert hoch

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: backend
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: backend
  minReplicaCount: 2        # HA (mindestens 2)
  maxReplicaCount: 10       # Dynamisch basiert auf CPU
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"         # Bei 70% CPU skaliert hoch
