apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: celery-worker-gratuit
  namespace: meeting-automation
spec:
  scaleTargetRef:
    name: celery-worker
  minReplicaCount: 0        # Scale-to-zero wenn Queue leer
  maxReplicaCount: 10       # Dynamisch basiert auf Queue-Tiefe
  pollingInterval: 15       # Alle 15s Queue pruefen
  cooldownPeriod: 300       # 5min nach letzter Message skaliert runter
  triggers:
    - type: rabbitmq
      authenticationRef:
        name: rabbitmq-auth
      metadata:
        queueName: transcription_gratuit
        mode: QueueLength
        value: "5"            # 5 Messages pro Worker
    - type: rabbitmq
      authenticationRef:
        name: rabbitmq-auth
      metadata:
        queueName: email
        mode: QueueLength
        value: "1"            # Scale bei 1. Email (kein Stranding)
    - type: rabbitmq
      authenticationRef:
        name: rabbitmq-auth
      metadata:
        queueName: maintenance
        mode: QueueLength
        value: "1"            # Scale bei 1. Maintenance-Task

