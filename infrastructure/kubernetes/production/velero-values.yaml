# Velero Helm Values — Production
# Chart: vmware-tanzu/velero v12.1.0
# App Version: v1.18.1
# Install: helm upgrade velero vmware-tanzu/velero -n velero -f velero-values.yaml --install
#
# Strategie (§4 korrigiert 2026-08-15):
# - Velero sichert NUR: ConfigMaps, Secrets, CNPG CRDs + n8n (1Gi) + sentinel (2Gi)
# - Velero sichert NICHT: PostgreSQL (pg_dump), MinIO (Self-Ref), RabbitMQ, Prometheus
# - Selector: app in (n8n, celery-worker-pro)
# - Disk-Budget: max 30% (87G auf 290G Disk)
# - Self-Referenz-Verhinderung: backup.velero.io/backup-volumes-excludes: minio-data
#
# PRODUCTION UNTERSCHIED:
# - MinIO-Passwort: 3Bsd1nsvjsnkCzcPvB96ew (NICHT minio_password!)
# - MinIO DNS: minio.meeting-automation.svc (NICHT minio-staging.meeting-automation-staging.svc!)
# - Namespace: meeting-automation (NICHT meeting-automation-staging!)

configuration:
  # Kopia als Upload-Type (statt Restic)
  uploaderType: "kopia"

  # File System Backup als Default aktivieren
  # Erzwingt Kopia-FSB für alle Pods (statt CSI-Snapshots)
  defaultVolumesToFsBackup: true

  # Backup Storage Location (MinIO)
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero-backups
      default: true
      config:
        region: minio
        s3ForcePathStyle: "true"
        s3Url: "http://minio.meeting-automation.svc:9000"

  # Keine Volume Snapshot Locations (MinIO hat keine CSI-Snapshots)
  volumeSnapshotLocation: []

  # Features
  features: ""

# Credentials für MinIO
# WICHTIG: Production MinIO-Passwort ist 3Bsd1nsvjsnkCzcPvB96ew (anders als Staging!)
credentials:
  useSecret: true
  name: velero-s3-credentials
  secretContents:
    cloud: |
      [default]
      aws_access_key_id = minio_user
      aws_secret_access_key = 3Bsd1nsvjsnkCzcPvB96ew

# Velero Server
image:
  repository: velero/velero
  tag: v1.18.1
  pullPolicy: IfNotPresent

# Server Args
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.9.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Keine Resource Limits (verhindert OOM-Kill des Plugin-Prozesses)
resources: {}

# Node-Agent
nodeAgent:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Repo Maintenance ConfigMap
repoMaintenanceJobConfigMap: velero-repo-maintenance

# Metrics für Prometheus
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack

# Schedules
# Selector: NUR n8n + sentinel (kein MinIO, kein PostgreSQL, kein Prometheus)
# TTL: 168h (7 Tage) — Disk-Budget max 87G auf 290G Disk
# Self-Referenz: minio-data ausgeschlossen via Annotation am StatefulSet
schedules:
  daily-backup:
    disabled: false
    schedule: "0 2 * * *"
    useOwnerReferencesInBackup: false
    template:
      includedNamespaces:
        - meeting-automation
      excludedNamespaces:
        - monitoring  # Prometheus erzeugt große Kopia-Daten
      ttl: 168h0m0s  # 7 Tage
      storageLocation: default
      defaultVolumesToFsBackup: true
      # NUR n8n + sentinel sichern (~3-5GB Kopia)
      # NICHT: minio (Self-Ref), postgres (pg_dump), rabbitmq (rekonstruierbar)
      labelSelector:
        matchExpressions:
          - key: app
            operator: In
            values:
              - n8n
              - celery-worker-pro
