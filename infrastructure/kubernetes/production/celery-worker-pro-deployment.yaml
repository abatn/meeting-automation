apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-pro
  namespace: meeting-automation
  labels:
    app: celery-worker-pro
    worker-tier: pro
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: celery-worker-pro
  template:
    metadata:
      labels:
        app: celery-worker-pro
        worker-tier: pro
    spec:
      initContainers:
      - name: sentinel-download
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          MODEL=/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          if [ -f "$MODEL" ]; then
            SIZE=$(wc -c < "$MODEL")
            if [ "$SIZE" -gt 900000000 ] && [ "$SIZE" -lt 1500000000 ]; then
              echo "Model already cached (${SIZE} bytes). Skipping download."
              exit 0
            fi
            echo "Model size ${SIZE} out of range. Re-downloading."
            rm -f "$MODEL"
          fi
          echo "Downloading model from MinIO..."
          wget -q --timeout=30 --tries=3 \
            -O "${MODEL}.tmp" \
            "http://minio:9000/sentinel-models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          SIZE=$(wc -c < "${MODEL}.tmp")
          if [ "$SIZE" -lt 900000000 ] || [ "$SIZE" -gt 1500000000 ]; then
            echo "ERROR: Downloaded model size ${SIZE} out of range. Removing."
            rm -f "${MODEL}.tmp"
            exit 1
          fi
          mv "${MODEL}.tmp" "$MODEL"
          echo "Model downloaded successfully (${SIZE} bytes)."
        volumeMounts:
        - name: sentinel-models
          mountPath: /models
      containers:
      - name: celery-worker
        image: docker.io/batnini/meeting-automation-backend:latest
        imagePullPolicy: Always
        command: ["bash", "-c", "until timeout 2 bash -c '</dev/tcp/rabbitmq/5672'; do echo 'Waiting for RabbitMQ...'; sleep 2; done; celery -A app.tasks.celery_app worker --loglevel=info -Q transcription_pro,email,maintenance"]
        resources:
          requests:
            memory: "2Gi"
            cpu: "200m"
            ephemeral-storage: "500Mi"
          limits:
            memory: "6Gi"
            cpu: "1"
            ephemeral-storage: "2Gi"
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - celery -A app.tasks.celery_app inspect ping --timeout=5
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - celery -A app.tasks.celery_app inspect ping --timeout=10
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
        volumeMounts:
        - name: sentinel-models
          mountPath: /app/models
      volumes:
      - name: sentinel-models
        persistentVolumeClaim:
          claimName: sentinel-models-claim
---
apiVersion: v1
kind: Service
metadata:
  name: celery-worker-pro
  namespace: meeting-automation
  labels:
    app: celery-worker-pro
spec:
  selector:
    app: celery-worker-pro
  ports:
  - port: 5555
    name: stats
  type: ClusterIP
