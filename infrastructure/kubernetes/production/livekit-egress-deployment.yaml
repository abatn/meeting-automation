apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress
  namespace: meeting-automation
  labels:
    app: livekit-egress
spec:
  replicas: 1
  strategy:
    type: Recreate  # hostNetwork requires Recreate (no two pods can bind same ports)
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: livekit-egress
  template:
    metadata:
      labels:
        app: livekit-egress
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: egress
        image: livekit/egress:v1.9.0
        env:
        - name: EGRESS_CONFIG_FILE
          value: /etc/livekit-egress/config.yaml
        - name: LIVEKIT_API_KEY
          value: "prod-9a4ac9f989143b65"
        - name: LIVEKIT_API_SECRET
          value: "prod-8f8b7b429f01180c89e03a1b30eeec4be871c0fa184c823a"
        - name: LIVEKIT_WS_URL
          value: "ws://livekit-server:7880"
        ports:
        - containerPort: 7000
          name: health
        volumeMounts:
        - name: egress-config
          mountPath: /etc/livekit-egress
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: egress-config
        configMap:
          name: livekit-egress-config
