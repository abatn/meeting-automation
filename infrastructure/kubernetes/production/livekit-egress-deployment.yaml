apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress
  namespace: meeting-automation
  labels:
    app: livekit-egress
spec:
  replicas: 1
  strategy:
    type: Recreate  # No rolling overlap: egress jobs must drain cleanly
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: livekit-egress
  template:
    metadata:
      labels:
        app: livekit-egress
    spec:
      # EGRESS SCALING (2026-09-11, tested on staging): hostNetwork removed for
      # multi-pod scaling. Signaling goes directly to the node IP (bypasses
      # Service DNAT, which kube-proxy cannot combine with NetworkPolicy
      # matching for hostNetwork server pods). Media (ICE UDP 50000-60000)
      # allowed via livekit-egress-policy ipBlocks.
      hostNetwork: false
      dnsPolicy: ClusterFirst
      containers:
      - name: egress
        image: livekit/egress:v1.9.0
        env:
        - name: EGRESS_CONFIG_FILE
          value: /etc/livekit-egress/config.yaml
        - name: LIVEKIT_API_KEY
          value: "prod-9a4ac9f989143b65"
        - name: LIVEKIT_API_SECRET
          value: "prod-8f8b7b429f01180c89e03a1b30eeec4be871c0fa184c823a"
        - name: LIVEKIT_WS_URL
          value: "ws://169.58.83.32:7880"  # Node IP directly - Service DNS + DNAT breaks NetworkPolicy matching for hostNetwork server
        ports:
        - containerPort: 7000
          name: health
        volumeMounts:
        - name: egress-config
          mountPath: /etc/livekit-egress
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2"
          # NOTE: LiveKit docs recommend 4 CPU / 4 Gi per egress instance for
          # RoomComposite. Current values mirror the tested staging config;
          # scale up per observed load.
        livenessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: egress-config
        configMap:
          name: livekit-egress-config
