apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-production
  namespace: meeting-automation
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "backend, livekit-server, onlyoffice"
spec:
  ingressClassName: nginx
  rules:
  - host: meeting-automation.com
    http:
      paths:
      - path: /n8n
        pathType: Prefix
        backend:
          service:
            name: n8n
            port:
              number: 5678
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /livekit
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /rtc
        pathType: Prefix
        backend:
          service:
            name: livekit-server
            port:
              number: 7880
      - path: /twirp
        pathType: Prefix
        backend:
          service:
            name: livekit-server
            port:
              number: 7880
      - path: /doc
        pathType: Prefix
        backend:
          service:
            name: onlyoffice
            port:
              number: 80
      - path: /web-apps
        pathType: Prefix
        backend:
          service:
            name: onlyoffice
            port:
              number: 80
      - path: /cache
        pathType: Prefix
        backend:
          service:
            name: onlyoffice
            port:
              number: 80
      - path: /healthcheck
        pathType: Prefix
        backend:
          service:
            name: onlyoffice
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
