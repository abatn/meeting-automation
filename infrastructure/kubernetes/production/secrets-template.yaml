# PRODUCTION SECRETS TEMPLATE
# ==================================
# This file shows the structure of required secrets.
# NEVER commit real values to git.
#
# To apply secrets on the production cluster:
#   kubectl apply -f <secret-file>.yaml -n meeting-automation
#
# To update a secret:
#   kubectl delete secret <name> -n meeting-automation
#   kubectl create secret generic <name> -n meeting-automation --from-literal=KEY=VALUE

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://meeting_user:<DB_PASS>@meeting-db-rw.meeting-automation.svc.cluster.local:5432/meeting_db"
  REDIS_URL: "redis://:<REDIS_PASS>@redis.meeting-automation.svc.cluster.local:6379/0"
  SECRET_KEY: "<SECRET_KEY>"
  S3_ACCESS_KEY: "<MINIO_ACCESS_KEY>"
  S3_SECRET_KEY: "<MINIO_SECRET_KEY>"
  ENCRYPTION_KEY: "<ENCRYPTION_KEY>"
  MISTRAL_API_KEY: "<MISTRAL_API_KEY>"
  GLADIA_API_KEY: "<GLADIA_API_KEY>"
  LIVEKIT_API_KEY: "<LIVEKIT_API_KEY>"
  LIVEKIT_API_SECRET: "<LIVEKIT_API_SECRET>"
  N8N_WEBHOOK_URL: "http://n8n:5678/webhook"
  ONLYOFFICE_URL: "http://onlyoffice:80"
  ONLYOFFICE_SECRET: "<ONLYOFFICE_JWT_SECRET>"
  PUBLIC_BACKEND_URL: "https://meeting-automation.com"
  CELERY_BROKER_URL: "amqp://rabbit_user:<RABBIT_PASS>@rabbitmq.meeting-automation.svc.cluster.local:5672//"
  CELERY_RESULT_BACKEND: "redis://:<REDIS_PASS>@redis.meeting-automation.svc.cluster.local:6379/2"
---
apiVersion: v1
kind: Secret
metadata:
  name: livekit-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  LIVEKIT_API_KEY: "<LIVEKIT_API_KEY>"
  LIVEKIT_API_SECRET: "<LIVEKIT_API_SECRET>"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  POSTGRES_USER: "<POSTGRES_USER>"
  POSTGRES_PASSWORD: "<POSTGRES_PASSWORD>"
  POSTGRES_DB: "meeting_db"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  REDIS_PASSWORD: "<REDIS_PASS>"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  MINIO_ROOT_USER: "<MINIO_ROOT_USER>"
  MINIO_ROOT_PASSWORD: "<MINIO_ROOT_PASSWORD>"
  MINIO_ACCESS_KEY: "<MINIO_ACCESS_KEY>"
  MINIO_SECRET_KEY: "<MINIO_SECRET_KEY>"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "<RABBIT_USER>"
  RABBITMQ_DEFAULT_PASS: "<RABBIT_PASS>"
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  N8N_BASIC_AUTH_USER: "<N8N_USER>"
  N8N_BASIC_AUTH_PASSWORD: "<N8N_PASS>"
  N8N_API_KEY: "<N8N_API_KEY>"
