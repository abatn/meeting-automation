apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pipeline
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  meeting-pipeline-overview.json: |
    {
      "uid": "meeting-pipeline-overview",
      "title": "Meeting Pipeline Overview",
      "tags": ["meeting-automation", "pipeline", "infrastructure"],
      "timezone": "browser",
      "refresh": "10s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "title": "Backend CPU (per Pod)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 } },
          "targets": [
            { "expr": "rate(container_cpu_usage_seconds_total{namespace=\"meeting-automation\",container=\"backend\"}[5m]) * 100", "legendFormat": "{{ pod }}" }
          ]
        },
        {
          "title": "Backend Memory (per Pod)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "container_memory_working_set_bytes{namespace=\"meeting-automation\",container=\"backend\"}", "legendFormat": "{{ pod }}" }
          ]
        },
        {
          "title": "All Containers CPU Top 5",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0 } },
          "targets": [
            { "expr": "topk(5, rate(container_cpu_usage_seconds_total{namespace=\"meeting-automation\"}[5m]) * 100)", "legendFormat": "{{ pod }}/{{ container }}", "instant": true }
          ]
        },
        {
          "title": "All Containers Memory Top 5",
          "type": "barchart",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            { "expr": "topk(5, container_memory_working_set_bytes{namespace=\"meeting-automation\"})", "legendFormat": "{{ pod }}/{{ container }}", "instant": true }
          ]
        },
        {
          "title": "Node CPU",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "steps": [
                { "value": 0, "color": "green" },
                { "value": 70, "color": "yellow" },
                { "value": 90, "color": "red" }
              ]}
            }
          },
          "targets": [
            { "expr": "instance:node_cpu_utilisation:rate5m * 100", "legendFormat": "{{ instance }}", "instant": true }
          ]
        },
        {
          "title": "Node Memory",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "steps": [
                { "value": 0, "color": "green" },
                { "value": 70, "color": "yellow" },
                { "value": 90, "color": "red" }
              ]}
            }
          },
          "targets": [
            { "expr": "instance:node_memory_utilisation:ratio * 100", "legendFormat": "{{ instance }}", "instant": true }
          ]
        },
        {
          "title": "Node Disk Free",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "steps": [
                { "value": 0, "color": "red" },
                { "value": 20, "color": "yellow" },
                { "value": 50, "color": "green" }
              ]}
            }
          },
          "targets": [
            { "expr": "(node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100", "legendFormat": "{{ instance }}", "instant": true }
          ]
        },
        {
          "title": "Running Pods",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [
                { "value": 0, "color": "red" },
                { "value": 15, "color": "green" }
              ]}
            }
          },
          "targets": [
            { "expr": "count(kube_pod_status_phase{namespace=\"meeting-automation\",phase=\"Running\"})", "legendFormat": "Running" }
          ]
        },
        {
          "title": "Pod Restarts (24h)",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "targets": [
            { "expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"meeting-automation\"})", "legendFormat": "{{ pod }}", "instant": true, "format": "table" }
          ],
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "pod": "Pod", "Value": "Restarts" } } }
          ]
        },
        {
          "title": "Target Health",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "targets": [
            { "expr": "up{namespace=\"meeting-automation\"}", "legendFormat": "{{ job }}", "instant": true, "format": "table" }
          ],
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "job": "Service", "Value": "Up (1=yes)" } } }
          ]
        }
      ],
      "schemaVersion": 39
    }
