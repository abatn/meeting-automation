apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: meeting-automation-backend
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - meeting-automation
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
