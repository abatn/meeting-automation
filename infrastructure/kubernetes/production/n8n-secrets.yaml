---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: meeting-automation
type: Opaque
stringData:
  N8N_SECURE_COOKIE: "false"
  # Staging uses its own PostgreSQL database
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "meeting-db-rw.meeting-automation.svc.cluster.local"
  DB_POSTGRESDB_PORT: "5432"
  DB_POSTGRESDB_DATABASE: "meeting_db"
  DB_POSTGRESDB_USER: "meeting_user"
  DB_POSTGRESDB_PASSWORD: "meeting_password"
  N8N_HOST: "n8n.meeting-automation.svc.cluster.local"
  N8N_PORT: "5678"
  WEBHOOK_URL: "http://n8n:5678"
