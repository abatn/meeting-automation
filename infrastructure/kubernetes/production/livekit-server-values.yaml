# LiveKit Server Helm Chart Values
# Production Environment
# Erstellt: 2026-08-08 (basierend auf Staging-Konfiguration)

replicaCount: 1
nameOverride: livekit-server
fullnameOverride: livekit-server

# LiveKit Server Konfiguration
config:
  port: 7880
  log_level: info
  rtc:
    tcp_port: 7881
    port_range_start: 50000
    port_range_end: 60000
    use_external_ip: true
    force_tcp: false
    allow_tcp_fallback: true
    tcp_fallback_rtt_threshold: 0
  redis:
    address: redis.meeting-automation.svc.cluster.local:6379
    password: flgyEhZKHVyMBge1QkdKtA
    db: 0
  keys:
    prod-9a4ac9f989143b65: prod-8f8b7b429f01180c89e03a1b30eeec4be871c0fa184c823a
  turn:
    enabled: true
    udp_port: 3478
  webhook:
    api_key: prod-9a4ac9f989143b65
    urls:
      - http://backend.meeting-automation.svc.cluster.local:8000/api/v1/livekit/webhooks

# Deployment Strategie
deploymentStrategy:
  type: Recreate  # hostNetwork erfordert Recreate

# Netzwerk
podHostNetwork: true
dnsPolicy: ClusterFirstWithHostNet

# Ressourcen (angepasst an Production-Workload)
resources:
  limits:
    cpu: 2000m
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

# Service
service:
  type: ClusterIP
  port: 7880

# Probes
livenessProbe:
  httpGet:
    path: /
    port: 7880
  initialDelaySeconds: 15
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /
    port: 7880
  initialDelaySeconds: 10
  periodSeconds: 10
