apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: meeting-automation-staging
data:
  default.conf: |
    server {
      listen 80;
      server_name localhost;

      root /usr/share/nginx/html;
      index index.html index.htm;

      # Security Headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;

      # Body size limit for file uploads (default: 1m)
      client_max_body_size 100M;

      # Gzip compression
      gzip on;
      gzip_types text/plain application/json application/javascript text/css application/xml;
      gzip_min_length 256;

      # index.html — never cache (always serve latest version)
      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      # Hashed assets — cache long-term (Vite adds content hash to filenames)
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      # WebSocket endpoint (Transcription Progress)
      location /api/v1/websockets/ {
        resolver 127.0.0.11 10.96.0.10 valid=10s;
        set $backend_upstream http://backend.meeting-automation-staging.svc.cluster.local:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
      }

      # OnlyOffice Document Server proxy
      location /web-apps/ {
        proxy_pass http://onlyoffice-staging.meeting-automation-staging.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_read_timeout 600s;
      }

      # OnlyOffice Cache (Editor.bin, images, etc.)
      location /cache/ {
        proxy_pass http://onlyoffice-staging.meeting-automation-staging.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
      }

      # OnlyOffice versionierter Redirect-Pfad (/9.3.1-.../web-apps/...)
      location ~ ^/[0-9]+\.[0-9]+\.[0-9]+[-.] {
        proxy_pass http://onlyoffice-staging.meeting-automation-staging.svc.cluster.local:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_read_timeout 600s;
      }

      # OnlyOffice Health-Check
      location /healthcheck {
        proxy_pass http://onlyoffice-staging.meeting-automation-staging.svc.cluster.local:80;
      }

      # API endpoints
      location /api/ {
        resolver 127.0.0.11 10.96.0.10 valid=10s;
        set $backend_upstream http://backend.meeting-automation-staging.svc.cluster.local:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-ID $http_x_client_id;
      }
    }
