apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-general
  namespace: meeting-automation-staging
spec:
  rateLimit:
    average: 50
    burst: 100
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth
  namespace: meeting-automation-staging
spec:
  rateLimit:
    average: 5
    burst: 10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: meeting-automation-staging
spec:
  redirectScheme:
    scheme: https
    permanent: true
