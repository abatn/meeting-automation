apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat-staging
  namespace: meeting-automation-staging
  labels:
    app: celery-beat-staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: celery-beat-staging
  template:
    metadata:
      labels:
        app: celery-beat-staging
    spec:
      containers:
      - name: celery-beat
        image: docker.io/batnini/meeting-automation-backend:6780e264
        imagePullPolicy: Always
        command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets-staging
        - configMapRef:
            name: backend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
            ephemeral-storage: "100Mi"
          limits:
            memory: "512Mi"
            cpu: "200m"
            ephemeral-storage: "500Mi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pgrep -f "celery.*beat" || exit 1
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
