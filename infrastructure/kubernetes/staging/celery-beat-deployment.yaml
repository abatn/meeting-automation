apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat-staging
  namespace: meeting-automation-staging
  labels:
    app: celery-beat-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat-staging
  template:
    metadata:
      labels:
        app: celery-beat-staging
    spec:
      containers:
      - name: celery-beat
        image: meeting-automation-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets-staging
        - configMapRef:
            name: backend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - celery -A app.tasks.celery_app inspect ping --timeout=5
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
