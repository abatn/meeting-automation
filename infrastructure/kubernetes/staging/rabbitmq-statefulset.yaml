apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq-staging
  namespace: meeting-automation-staging
spec:
  serviceName: "rabbitmq-staging"
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq-staging
  template:
    metadata:
      labels:
        app: rabbitmq-staging
    spec:
      containers:
      - name: rabbitmq
        image: rabbitmq:3-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15672
          name: management
        readinessProbe:
          exec:
            command: ["rabbitmq-diagnostics", "check_running"]
          initialDelaySeconds: 10
          periodSeconds: 10
        envFrom:
        - secretRef:
            name: rabbitmq-secrets
        volumeMounts:
        - name: rabbitmq-staging-storage
          mountPath: /var/lib/rabbitmq
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
  volumeClaimTemplates:
  - metadata:
      name: rabbitmq-staging-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-staging
  namespace: meeting-automation-staging
  labels:
    app: rabbitmq-staging
spec:
  selector:
    app: rabbitmq-staging
  ports:
  - port: 5672
    targetPort: 5672
    name: amqp
  - port: 15672
    targetPort: 15672
    name: management
  type: ClusterIP
