apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-staging
  namespace: meeting-automation-staging
  labels:
    app: celery-worker-staging
    worker-tier: gratuit
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: celery-worker-staging
  template:
    metadata:
      labels:
        app: celery-worker-staging
        worker-tier: gratuit
    spec:
      containers:
      - name: celery-worker
        image: docker.io/batnini/meeting-automation-backend:latest
        imagePullPolicy: Always
        command: ["bash", "-c", "until timeout 2 bash -c '</dev/tcp/rabbitmq-staging/5672'; do echo 'Waiting for RabbitMQ...'; sleep 2; done; celery -A app.tasks.celery_app worker --loglevel=info -Q transcription,transcription_gratuit,onnx,email,maintenance"]
        resources:
          requests:
            memory: "1500Mi"
            cpu: "200m"
            ephemeral-storage: "200Mi"
          limits:
            memory: "3Gi"
            cpu: "500m"
            ephemeral-storage: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            # INCIDENT 2026-09-25: self-targeted only. The fleet-wide ping as a
            # KILL switch killed healthy pods whenever a neighbour died (OOM),
            # producing the ~6-min mass kill-reload wave. Fleet check kept below
            # as readinessProbe (visibility, no kill).
            - celery -A app.tasks.celery_app inspect ping -d celery@$(hostname) --timeout=10
          initialDelaySeconds: 90
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            # fleet-wide rendezvous kept for cluster visibility (events only)
            - celery -A app.tasks.celery_app inspect ping --timeout=20
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 60
          failureThreshold: 3
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets-staging
        - configMapRef:
            name: backend-config
---
apiVersion: v1
kind: Service
metadata:
  name: celery-worker-staging
  namespace: meeting-automation-staging
  labels:
    app: celery-worker-staging
spec:
  selector:
    app: celery-worker-staging
  ports:
  - port: 5555
    name: stats
  type: ClusterIP
