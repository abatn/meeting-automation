apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-server-staging
  namespace: meeting-automation-staging
  labels:
    app: livekit-server-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit-server-staging
  template:
    metadata:
      labels:
        app: livekit-server-staging
    spec:
      nodeSelector:
        kubernetes.io/hostname: instance-20260329-0846
      containers:
      - name: livekit
        image: livekit/livekit-server:latest
        args: ["--config", "/etc/livekit.yaml"]
        ports:
        - containerPort: 7880
          name: http
        - containerPort: 7881
          name: tcp
        - containerPort: 3478
          name: turn
          protocol: UDP
        - containerPort: 50000
          name: udp-start
          protocol: UDP
        - containerPort: 60000
          name: udp-end
          protocol: UDP
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit.yaml
          subPath: livekit.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 7880
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: livekit-config
        configMap:
          name: livekit-config-staging
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-server-staging
  namespace: meeting-automation-staging
  labels:
    app: livekit-server-staging
spec:
  selector:
    app: livekit-server-staging
  ports:
  - port: 7880
    targetPort: 7880
    name: http
  - port: 7881
    targetPort: 7881
    name: tcp
  type: ClusterIP
