---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets-staging
  namespace: meeting-automation-staging
type: Opaque
stringData:
  # Database connection (internal K8s DNS)
  DATABASE_URL: "postgresql+asyncpg://meeting_user:meeting_password@postgres-staging.meeting-automation-staging.svc.cluster.local:5432/meeting_db_staging"
  # Redis
  REDIS_URL: "redis://default:redis_password@redis-staging.meeting-automation-staging.svc.cluster.local:6379/0"
  # Secret key for JWT (use different key than production!)
  SECRET_KEY: "staging-secret-key-change-this-in-production-2026"
  # S3 credentials (staging sandbox)
  S3_ACCESS_KEY: "minio_user_staging"
  S3_SECRET_KEY: "minio_password_staging"
  # AI Service keys (use sandbox/test keys from GitHub Secrets)
  MISTRAL_API_KEY: "${MISTRAL_API_KEY_STAGING}"
  GLADIA_API_KEY: "${GLADIA_API_KEY_STAGING}"
  # n8n (staging webhook endpoint)
  N8N_WEBHOOK_URL: "http://n8n-staging:5678/webhook"
  # OnlyOffice
  ONLYOFFICE_URL: "http://onlyoffice-staging:80"
  ONLYOFFICE_SECRET: "staging-onlyoffice-secret-jwt-key-2026"
  # Public backend URL for external services
  PUBLIC_BACKEND_URL: "http://backend-staging.meeting-automation-staging.svc.cluster.local:8000"
  # Celery
  CELERY_BROKER_URL: "amqp://rabbit_user:rabbit_password@rabbitmq-staging.meeting-automation-staging.svc.cluster.local:5672//"
  CELERY_RESULT_BACKEND: "redis://:redis_password@redis-staging.meeting-automation-staging.svc.cluster.local:6379/2"
  # E2E Test User (populated via kubectl create secret from CLI during CI)
  E2E_TEST_USER_EMAIL: "e2e-tester@staging.example.com"
  E2E_TEST_USER_PASSWORD: "placeholder-to-be-replaced-by-ci"
