apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: staging-api-route
  namespace: meeting-automation-staging
spec:
  entryPoints:
    - websecure
  tls:
    secretName: traefik-tls-cert-staging  # Create this TLS secret in the staging namespace
  routes:
    # Authentication endpoints (stricter rate limit)
    - match: Host(`staging.meeting-automate.tn`) && PathPrefix(`/api/v1/auth`)
      kind: Rule
      services:
        - name: backend
          port: 8000
      middlewares:
        - name: rate-limit-auth
    # General API
    - match: Host(`staging.meeting-automate.tn`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend
          port: 8000
      middlewares:
        - name: rate-limit-general
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: staging-redirect-http
  namespace: meeting-automation-staging
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`staging.meeting-automate.tn`)
      kind: Rule
      services:
        - name: backend
          port: 8000
      middlewares:
        - name: redirect-to-https
