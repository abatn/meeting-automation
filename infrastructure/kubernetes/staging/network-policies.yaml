# Network Policies for Meeting Automation (ISO 27001 Compliance)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: meeting-automation-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Postgres: Only allow Backend, n8n, Celery
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: postgres-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: n8n-staging
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    ports:
    - protocol: TCP
      port: 5432
---
# Redis: Backend, Celery, Egress, LiveKit Server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: redis-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    ports:
    - protocol: TCP
      port: 6379
---
# RabbitMQ: Only allow Backend and Celery
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: rabbitmq-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    ports:
    - protocol: TCP
      port: 5672
    - protocol: TCP
      port: 15672
---
# MinIO: Only allow Backend, Celery and Frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: minio-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
---
# Backend: Allow Frontend + LiveKit (webhook)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: backend
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    ports:
    - protocol: TCP
      port: 8000
---
# Frontend: Allow from everywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: frontend
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
---
# OnlyOffice: Allow Backend and Frontend, egress to RabbitMQ
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onlyoffice-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: onlyoffice-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq-staging
    ports:
    - protocol: TCP
      port: 5672
---
# n8n: Allow Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: n8n-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5678
---
# LiveKit Server: Egress to Redis, Backend, DNS + Ingress from Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: livekit-server-staging
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    ports:
    - protocol: TCP
      port: 7880
    - protocol: TCP
      port: 7881
  policyTypes:
  - Ingress
  - Egress
---
# LiveKit Egress: Egress to Redis, MinIO, LiveKit, DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-egress-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: livekit-egress-staging
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: minio-staging
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    ports:
    - protocol: TCP
      port: 7880
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
