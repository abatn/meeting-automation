# Network Policies for Meeting Automation (ISO 27001 Compliance)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: meeting-automation-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Postgres: Only allow Backend, n8n, Celery, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: postgres-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5432
---
# Redis: Backend, Celery, Celery-Pro, Egress, LiveKit Server, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: redis-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 6379
---
# RabbitMQ: Only allow Backend, Celery, Celery-Pro, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: rabbitmq-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5672
    - protocol: TCP
      port: 15672
---
# MinIO: Allow Backend, Celery, Celery-Pro, Frontend, CNPG (WAL-Archiv), Prometheus,
# LiveKit Egress (S3 upload of recordings - required since egress runs on pod network)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: minio-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
---
# Backend: Allow Frontend + LiveKit (webhook) + OnlyOffice (callback) + n8n (Get Meeting Details/PDF) + Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: backend
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    - podSelector:
        matchLabels:
          app: onlyoffice-staging
    - podSelector:
        matchLabels:
          app: n8n-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8000
---
# Frontend: Allow from everywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: frontend
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
---
# OnlyOffice: Allow Backend and Frontend, egress to RabbitMQ, DNS, Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onlyoffice-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: onlyoffice-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq-staging
    ports:
    - protocol: TCP
      port: 5672
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000
---
# n8n: Allow Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: n8n-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5678
---
# LiveKit Server: Egress to Redis, Backend, DNS + Ingress from Egress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: livekit-server-staging
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 7880
    - protocol: TCP
      port: 7881
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 7881
    - protocol: UDP
      port: 3478
  policyTypes:
  - Ingress
  - Egress
---
# LiveKit Egress: Egress to Redis, MinIO, LiveKit (signaling + ICE media), DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-egress-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: livekit-egress-staging
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: minio-staging
    ports:
    - protocol: TCP
      port: 9000
  - to:
    # LiveKit Server (hostNetwork: true) advertises ICE candidates on node IP,
    # flannel.1/cni0 and docker0. Service DNS + DNAT breaks NetworkPolicy matching
    # for hostNetwork pods, so the server is allowed via ipBlock entries.
    # FIX 2026-09-11 (tested on staging): media ports were missing -> egress aborted
    # after ~15s with "Start signal not received" because ICE connectivity checks
    # (UDP) never reached the server.
    - ipBlock:
        cidr: 10.0.0.191/32      # node IP (ws_url signaling + ICE)
    - ipBlock:
        cidr: 158.180.18.110/32  # public IP (use_external_ip ICE candidate)
    - ipBlock:
        cidr: 10.42.0.0/32       # flannel.1 ICE candidate
    - ipBlock:
        cidr: 10.42.0.1/32       # cni0 ICE candidate
    - ipBlock:
        cidr: 172.17.0.1/32      # docker0 ICE candidate
    ports:
    - protocol: TCP
      port: 7880                 # signaling (ws_url)
    - protocol: TCP
      port: 7881                 # ICE/TCP fallback
    - protocol: UDP
      port: 50000
      endPort: 60000             # RTP media (rtc.port_range_start/end)
    - protocol: UDP
      port: 3478                 # TURN
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
---
# CNPG (meeting-db): Allow backend, n8n, celery-worker, celery-worker-pro, celery-beat, cnpg-system, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: n8n-staging
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187

# CNPG MinIO Access: CNPG Pods brauchen Zugriff auf MinIO fuer WAL-Archiv
# (Bereits in minio-policy enthalten via CNPG Label app.kubernetes.io/name=postgresql)
