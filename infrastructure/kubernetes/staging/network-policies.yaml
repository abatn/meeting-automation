# Network Policies for Meeting Automation (ISO 27001 Compliance)
# Aktualisiert: 2026-08-12 - Helm-Labels (app.kubernetes.io/name) ergänzt
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: meeting-automation-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Postgres: Only allow Backend, n8n, Celery, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: postgres-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5432
---
# Redis: Backend, Celery, Celery-Pro, Egress, LiveKit Server, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: redis-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: egress
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: livekit-server-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 6379
---
# RabbitMQ: Only allow Backend, Celery, Celery-Pro, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: rabbitmq-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5672
    - protocol: TCP
      port: 15672
---
# MinIO: Allow Backend, Celery, Celery-Pro, Frontend, CNPG (WAL-Archiv), Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: minio-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: postgresql
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: velero   # Velero BSL → MinIO Zugriff
    ports:
    - protocol: TCP
      port: 9000
    - protocol: TCP
      port: 9001
---
# Backend: Allow Frontend + LiveKit (webhook) + OnlyOffice (callback) + n8n (Get Meeting Details/PDF) + Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: backend
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: frontend
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: livekit-server-staging
    - podSelector:
        matchLabels:
          app: onlyoffice-staging
    - podSelector:
        matchLabels:
          app: n8n-staging
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8000
---
# Frontend: Allow from everywhere
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: frontend
  ingress:
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 80
---
# OnlyOffice: Allow Backend and Frontend, egress to RabbitMQ, DNS, Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: onlyoffice-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: onlyoffice-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: frontend
    ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: rabbitmq-staging
    ports:
    - protocol: TCP
      port: 5672
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000
---
# n8n: Allow Backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: n8n-staging
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5678
---
# LiveKit Server: Egress to Redis, Backend, DNS + Ingress from Egress + Frontend (external)
# FIXED: podSelector auf Helm-Label geaendert (app.kubernetes.io/name)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: livekit-server-staging
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 8000
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: livekit-egress-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: egress
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 7880
    - protocol: TCP
      port: 7881
  - from:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 7881
    - protocol: UDP
      port: 3478
  policyTypes:
  - Ingress
  - Egress
---
# LiveKit Egress: Egress to Redis, MinIO, LiveKit, DNS
# FIXED: podSelector auf Helm-Label geaendert (app.kubernetes.io/name)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: livekit-egress-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis-staging
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: minio-staging
    ports:
    - protocol: TCP
      port: 9000
  - to:
    - podSelector:
        matchLabels:
          app: livekit-server-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: livekit-server-staging
    ports:
    - protocol: TCP
      port: 7880
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    to:
    - namespaceSelector: {}
---
# CNPG (meeting-db): Allow backend, n8n, celery-worker, celery-worker-pro, celery-beat, cnpg-system, Prometheus
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnpg-policy
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    - podSelector:
        matchLabels:
          app: backend
    - podSelector:
        matchLabels:
          app: n8n-staging
    - podSelector:
        matchLabels:
          app: celery-worker-staging
    - podSelector:
        matchLabels:
          app: celery-worker-pro-staging
    - podSelector:
        matchLabels:
          app: celery-beat-staging
    - podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: cloudnative-pg
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 9187
  - from:
    - podSelector:
        matchLabels:
          app: postgres-backup-staging
    ports:
    - protocol: TCP
      port: 5432

# CNPG MinIO Access: CNPG Pods brauchen Zugriff auf MinIO fuer WAL-Archiv
# (Bereits in minio-policy enthalten via CNPG Label app.kubernetes.io/name=postgresql)
