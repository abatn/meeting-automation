apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: meeting-automation-staging
data:
  DEBUG: "false"
  PROJECT_NAME: "Meeting Automation (Staging)"
  VERSION: "1.0.0-staging"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  S3_ENDPOINT: "http://minio-staging:9000"
  S3_BUCKET_NAME: "meeting-recordings-staging"
  LIVEKIT_URL: "ws://livekit-server-staging:7880"
  LIVEKIT_PUBLIC_URL: "wss://staging.meeting-automate.tn"
  LIVEKIT_EGRESS_BUCKET: "meeting-recordings-staging"
  LIVEKIT_EGRESS_S3_ENDPOINT: "http://minio-staging:9000"
  # IMPORTANT: After deployment, update to MinIO ClusterIP for hostNetwork Egress:
  # kubectl patch configmap backend-config -n meeting-automation-staging --type merge -p '{"data":{"LIVEKIT_EGRESS_S3_ENDPOINT":"http://<MINIO_CLUSTER_IP>:9000"}}'
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  EMAIL_FROM: "noreply@staging.meeting-automate.tn"
  WHATSAPP_API_URL: "https://graph.facebook.com/v18.0"
  WHATSAPP_PHONE_ID: "staging-phone-id"
  N8N_WEBHOOK_URL: "http://n8n-staging:5678/webhook"
  N8N_WEBHOOK_MEETING_CREATED: "http://n8n-staging:5678/webhook/meeting-created"
  N8N_WEBHOOK_MEETING_STATUS_CHANGED: "http://n8n-staging:5678/webhook/meeting-status-changed"
  N8N_WEBHOOK_AUDIO_UPLOADED: "http://n8n-staging:5678/webhook/audio-uploaded"
  N8N_WEBHOOK_PV_VALIDATED: "http://n8n-staging:5678/webhook/pv-validated"
  N8N_WEBHOOK_DAILY_REMINDER: "http://n8n-staging:5678/webhook/daily-reminders"
  N8N_WEBHOOK_TRANSCRIPTION_COMPLETED: "http://n8n-staging:5678/webhook/transcription-completed"
  PUBLIC_BACKEND_URL: "https://staging.meeting-automate.tn"
  FRONTEND_URL: "https://staging.meeting-automate.tn"
  CORS_ORIGINS: '["https://staging.meeting-automate.tn","http://localhost:3000"]'
