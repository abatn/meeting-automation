apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meeting-staging
  namespace: meeting-automation-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    nginx.ingress.kubernetes.io/websocket-services: "backend, livekit-server-staging, onlyoffice-staging"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - staging.meeting-automation.com
    secretName: staging-tls
  rules:
  - host: staging.meeting-automation.com
    http:
      paths:
      - path: /n8n
        pathType: Prefix
        backend:
          service:
            name: n8n-staging
            port:
              number: 5678
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /livekit
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /rtc
        pathType: Prefix
        backend:
          service:
            name: livekit-server-staging
            port:
              number: 7880
      - path: /twirp
        pathType: Prefix
        backend:
          service:
            name: livekit-server-staging
            port:
              number: 7880
      - path: /doc
        pathType: Prefix
        backend:
          service:
            name: onlyoffice-staging
            port:
              number: 80
      - path: /web-apps
        pathType: Prefix
        backend:
          service:
            name: onlyoffice-staging
            port:
              number: 80
      - path: /cache
        pathType: Prefix
        backend:
          service:
            name: onlyoffice-staging
            port:
              number: 80
      - path: /healthcheck
        pathType: Prefix
        backend:
          service:
            name: onlyoffice-staging
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
