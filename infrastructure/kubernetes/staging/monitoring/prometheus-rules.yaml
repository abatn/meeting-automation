apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: meeting-automation-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack  # Must match Prometheus selector
spec:
  groups:
    - name: meeting-automation-pipeline
      rules:
        # Pipeline Failure Rate > 5%
        - alert: PipelineHighFailureRate
          expr: |
            rate(pipeline_failures_total{stage="pipeline"}[5m])
            / rate(pipeline_recordings_total[5m]) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pipeline failure rate > 5%"
            description: "Pipeline failure rate is {{ $value | humanizePercentage }}"

        # Pipeline Latency > 90s
        - alert: PipelineHighLatency
          expr: |
            histogram_quantile(0.95, rate(pipeline_stage_duration_seconds_bucket{stage="pipeline_total"}[5m])) > 90
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pipeline P95 latency > 90s"
            description: "Pipeline P95 latency is {{ $value }}s"

        # Active Recordings > 5 (potential queue backup)
        - alert: HighActiveRecordings
          expr: active_recordings > 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Too many active recordings"
            description: "{{ $value }} recordings are currently being processed"

    - name: meeting-automation-services
      rules:
        # Backend Service Down
        - alert: BackendServiceDown
          expr: up{job="backend"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Backend service is down"
            description: "Backend has been unreachable for more than 1 minute"

        # PostgreSQL High Connection Usage
        - alert: PostgreSQLHighConnections
          expr: |
            pg_stat_activity_count / pg_settings_max_connections > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL connection pool > 80%"
            description: "PostgreSQL is using {{ $value | humanizePercentage }} of max connections"

        # Redis High Memory
        - alert: RedisHighMemory
          expr: |
            redis_memory_used_bytes / redis_memory_max_bytes > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Redis memory > 80%"
            description: "Redis is using {{ $value | humanizePercentage }} of max memory"

    - name: meeting-automation-infrastructure
      rules:
        # High Memory Usage (> 80% of limit)
        - alert: ContainerHighMemory
          expr: |
            container_memory_usage_bytes{namespace="meeting-automation-staging"}
            / container_spec_memory_limit_bytes > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Container memory > 80% of limit"
            description: "Container {{ $labels.name }} is using {{ $value | humanizePercentage }} of memory limit"

        # Disk Space Warning (> 70% used)
        - alert: DiskSpaceWarning
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk space < 30% free"
            description: "Only {{ $value | humanizePercentage }} of disk space is available"

        # Disk Space Low (< 20% free)
        - alert: DiskSpaceLow
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Disk space < 20% free"
            description: "Only {{ $value | humanizePercentage }} of disk space is available"

        # Disk Space Critical (< 15% free)
        - alert: DiskSpaceCritical
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.15
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Disk space < 15% free"
            description: "Only {{ $value | humanizePercentage }} of disk space is available — immediate action required"

        # Disk Space Emergency (< 5% free)
        - alert: DiskSpaceEmergency
          expr: |
            node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.05
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Disk space < 5% free — EMERGENCY"
            description: "Only {{ $value | humanizePercentage }} of disk space is available — system may crash"

        # MinIO PVC Usage > 80% (Warning)
        - alert: MinIOPvcHighUsage
          expr: |
            kubelet_volume_stats_used_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"minio.*"}
            / kubelet_volume_stats_capacity_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"minio.*"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MinIO PVC usage > 80%"
            description: "MinIO PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

        # MinIO PVC Usage > 90% (Critical)
        - alert: MinIOPvcCriticalUsage
          expr: |
            kubelet_volume_stats_used_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"minio.*"}
            / kubelet_volume_stats_capacity_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"minio.*"} > 0.9
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MinIO PVC usage > 90%"
            description: "MinIO PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full — disk-pressure imminent!"

        # PostgreSQL / DB PVC Usage > 80% (Warning) — Haupt-Disk-Verbraucher (CNPG)
        - alert: PostgresPvcHighUsage
          expr: |
            kubelet_volume_stats_used_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"meeting-db.*|postgres.*"}
            / kubelet_volume_stats_capacity_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"meeting-db.*|postgres.*"} > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "PostgreSQL PVC usage > 80%"
            description: "PostgreSQL PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

        # PostgreSQL / DB PVC Usage > 90% (Critical)
        - alert: PostgresPvcCriticalUsage
          expr: |
            kubelet_volume_stats_used_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"meeting-db.*|postgres.*"}
            / kubelet_volume_stats_capacity_bytes{namespace="meeting-automation-staging", persistentvolumeclaim=~"meeting-db.*|postgres.*"} > 0.9
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "PostgreSQL PVC usage > 90%"
            description: "PostgreSQL PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full — disk-pressure imminent!"

        # Velero Backup Size > 30GB (Warning)
        - alert: VeleroBackupSizeHigh
          expr: |
            velero_backup_attempted_bytes > 32212254720
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup size > 30GB"
            description: "Velero backup size is {{ $value | humanize1024 }}B — consider using scoped backups"

        # Gladia API Errors
        - alert: GladiaHighErrorRate
          expr: |
            rate(service_request_errors_total{service="gladia"}[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gladia API error rate > 10%"
            description: "Gladia is returning errors at {{ $value | humanizePercentage }} rate"

        # Mistral API Errors
        - alert: MistralHighErrorRate
          expr: |
            rate(service_request_errors_total{service="mistral"}[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Mistral API error rate > 10%"
            description: "Mistral is returning errors at {{ $value | humanizePercentage }} rate"

    - name: meeting-automation-pipeline-extended
      rules:
        - alert: CeleryQueueBacklog
          expr: celery_queue_depth > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Celery queue backlog > 50 messages"
            description: "Queue {{ $labels.queue }} has {{ $value }} pending messages"

        - alert: PipelineStageSlowdown
          expr: |
            histogram_quantile(0.95,
              sum(rate(pipeline_stage_duration_seconds_bucket[5m])) by (le, stage)
            ) > 120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pipeline stage P95 > 120s"
            description: "Stage {{ $labels.stage }} P95 latency is {{ $value }}s"

        - alert: RecordingSpikeDetected
          expr: |
            increase(pipeline_recordings_total[5m])
            > 2 * avg_over_time(increase(pipeline_recordings_total[5m])[1h:5m])
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Recording spike detected"
            description: "{{ $value }} recordings in 5min (2x hourly average)"

    - name: meeting-automation-storage-quota
      rules:
        - alert: StorageQuotaWarning
          expr: storage_usage_bytes > 5368709120
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Tenant storage > 5GB"
            description: "Tenant {{ $labels.client_id }} using {{ $value | humanize1024 }}B"

        - alert: StorageQuotaCritical
          expr: storage_usage_bytes > 9663676416
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Tenant storage > 9GB"
            description: "Tenant {{ $labels.client_id }} using {{ $value | humanize1024 }}B — near quota limit"
