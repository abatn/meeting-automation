apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress-staging
  namespace: meeting-automation-staging
  labels:
    app: livekit-egress-staging
spec:
  replicas: 1
  strategy:
    type: Recreate  # No rolling overlap: egress jobs must drain cleanly
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: livekit-egress-staging
  template:
    metadata:
      labels:
        app: livekit-egress-staging
    spec:
      # EGRESS SCALING (2026-09-11, tested): hostNetwork removed for multi-pod
      # scaling. Signaling goes directly to the node IP (bypasses Service DNAT,
      # which kube-proxy cannot combine with NetworkPolicy for hostNetwork pods).
      # Media (ICE UDP 50000-60000) allowed via livekit-egress-policy ipBlocks.
      hostNetwork: false
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: instance-20260329-0846
      containers:
      - name: egress
        image: livekit/egress:v1.9.0
        env:
        - name: EGRESS_CONFIG_FILE
          value: /etc/livekit-egress/config.yaml
        - name: LIVEKIT_API_KEY
          value: "meeting-api-key"
        - name: LIVEKIT_API_SECRET
          value: "meeting-api-secret-2026-minimum-32-chars!"
        - name: LIVEKIT_WS_URL
          value: "ws://10.0.0.191:7880"  # Node IP directly - Service DNS + DNAT breaks NetworkPolicy matching for hostNetwork server
        ports:
        - containerPort: 7000
          name: health
        volumeMounts:
        - name: egress-config
          mountPath: /etc/livekit-egress
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
            ephemeral-storage: "200Mi"
          limits:
            memory: "2Gi"
            cpu: "2"
            ephemeral-storage: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: egress-config
        configMap:
          name: livekit-egress-config-staging
