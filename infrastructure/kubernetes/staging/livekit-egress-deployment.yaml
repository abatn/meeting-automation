apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-egress-staging
  namespace: meeting-automation-staging
  labels:
    app: livekit-egress-staging
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: livekit-egress-staging
  template:
    metadata:
      labels:
        app: livekit-egress-staging
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: instance-20260329-0846
      containers:
      - name: egress
        image: livekit/egress:latest
        env:
        - name: EGRESS_CONFIG_FILE
          value: /etc/livekit-egress/config.yaml
        - name: LIVEKIT_API_KEY
          value: "meeting-api-key"
        - name: LIVEKIT_API_SECRET
          value: "meeting-api-secret-2026-minimum-32-chars!"
        - name: LIVEKIT_WS_URL
          value: "ws://livekit-server-staging:7880"
        ports:
        - containerPort: 7000
          name: health
        volumeMounts:
        - name: egress-config
          mountPath: /etc/livekit-egress
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
            ephemeral-storage: "200Mi"
          limits:
            memory: "2Gi"
            cpu: "1"
            ephemeral-storage: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 15
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 7000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: egress-config
        configMap:
          name: livekit-egress-config-staging
