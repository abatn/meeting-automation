apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: staging-api-route
  namespace: meeting-automation-staging
spec:
  entryPoints:
    - web
  routes:
    # Authentication endpoints (stricter rate limit)
    - match: Host(`staging.meeting-automate.tn`) && PathPrefix(`/api/v1/auth`)
      kind: Rule
      services:
        - name: backend
          port: 8000
      middlewares:
        - name: rate-limit-auth
    # General API
    - match: Host(`staging.meeting-automate.tn`) && PathPrefix(`/api`)
      kind: Rule
      services:
        - name: backend
          port: 8000
      middlewares:
        - name: rate-limit-general
    # Frontend (catch-all — must be last)
    - match: Host(`staging.meeting-automate.tn`)
      kind: Rule
      priority: 1
      services:
        - name: frontend
          port: 80
