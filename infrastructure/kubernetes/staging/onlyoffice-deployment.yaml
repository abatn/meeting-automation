apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice-staging
  namespace: meeting-automation-staging
  labels:
    app: onlyoffice-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onlyoffice-staging
  template:
    metadata:
      labels:
        app: onlyoffice-staging
    spec:
      containers:
      - name: onlyoffice
        image: onlyoffice/documentserver:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: JWT_ENABLED
          value: "true"
        - name: JWT_SECRET
          value: "staging-onlyoffice-secret-jwt-key-2026"
        - name: JWT_HEADER
          value: "Authorization"
        - name: ALLOW_PRIVATE_IP_ADDRESS
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice-staging
  namespace: meeting-automation-staging
  labels:
    app: onlyoffice-staging
spec:
  selector:
    app: onlyoffice-staging
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
