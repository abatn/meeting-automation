apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config-staging
  namespace: meeting-automation-staging
data:
  livekit.yaml: |
    port: 7880
    log_level: info
    rtc:
      tcp_port: 7881
      port_range_start: 50000
      port_range_end: 60000
      use_external_ip: true
      force_tcp: false
    redis:
      address: redis-staging.meeting-automation-staging.svc.cluster.local:6379
      password: redis_password
      db: 0
    keys:
      meeting-api-key: meeting-api-secret-2026
    turn:
      enabled: true
      udp_port: 3478
    webhook:
      api_key: meeting-api-key
      urls:
        - http://backend.meeting-automation-staging.svc.cluster.local:8000/api/v1/livekit/webhooks
