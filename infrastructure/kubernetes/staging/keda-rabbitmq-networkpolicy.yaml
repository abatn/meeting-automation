apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-allow-keda
  namespace: meeting-automation-staging
spec:
  podSelector:
    matchLabels:
      app: rabbitmq-staging
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keda
    ports:
    - port: 5672
      protocol: TCP
    - port: 15672
      protocol: TCP
