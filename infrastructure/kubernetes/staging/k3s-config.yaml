# k3s configuration — Meeting Automation Staging

write-kubeconfig-mode: "644"

disable:
  - traefik
  - metrics-server  # F7: k3s-embedded deaktivieren, eigenes Standalone-Manifest nutzen

node-name: oci-staging

tls-san:
  - 158.180.18.110
  - staging.meeting-automation.com

kubelet-arg:
  - "image-gc-high-threshold=75"
  - "image-gc-low-threshold=70"
  - "system-reserved=cpu=500m,memory=1Gi,ephemeral-storage=5Gi"  # F6: System-Puffer
  - "eviction-hard=nodefs.available<10%,imagefs.available<15%"     # F6: Eviction-Threshold
