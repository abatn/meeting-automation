apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: meeting-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: meeting-automation-backend:latest
        imagePullPolicy: Never
        command: ["bash", "-c", "echo 'Waiting 10s for RabbitMQ...' && sleep 10 && celery -A app.tasks.celery_app worker --loglevel=info"]
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
