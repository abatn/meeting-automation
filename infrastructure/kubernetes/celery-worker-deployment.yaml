apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: meeting-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: meeting-automation-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["bash", "-c", "until timeout 2 bash -c '</dev/tcp/rabbitmq/5672'; do echo 'Waiting for RabbitMQ...'; sleep 2; done; celery -A app.tasks.celery_app worker --loglevel=info"]
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
