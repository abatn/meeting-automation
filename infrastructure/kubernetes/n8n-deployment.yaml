apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: meeting-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: n8nio/n8n:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5678
        env:
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          value: "postgres"
        - name: DB_POSTGRESDB_PORT
          value: "5432"
        - name: DB_POSTGRESDB_DATABASE
          value: "meeting_db"
        - name: DB_POSTGRESDB_USER
          value: "meeting_user"
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: DB_POSTGRESDB_PASSWORD
        - name: N8N_PORT
          value: "5678"
        - name: DB_POSTGRESDB_CONNECTION_TIMEOUT
          value: "30000"
        - name: DB_POSTGRESDB_POOL_SIZE
          value: "3"
        - name: DB_POSTGRESDB_POOL_MAX
          value: "5"
        - name: N8N_DIAGNOSTICS_ENABLED
          value: "false"
        - name: N8N_METRICS
          value: "true"
        envFrom:
        - secretRef:
            name: n8n-secrets
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc
