apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: meeting-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
      - name: celery-beat
        image: meeting-automation-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
        env:
        - name: PYTHONPATH
          value: "/app"
        envFrom:
        - secretRef:
            name: backend-secrets
        - configMapRef:
            name: backend-config
