apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: meeting-automation
spec:
  defaultCertificate:
    secretName: traefik-tls-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: meeting-automation
spec:
  redirectScheme:
    scheme: https
    permanent: true
