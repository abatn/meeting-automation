port: 7880
rtc:
  # Port-Range erweitert: 7881-7890 (10 Ports) für parallele Egress-Connections
  # node_ip wird dynamisch via docker-compose entrypoint gesetzt
  port_range_start: 7881
  port_range_end: 7890
  use_external_ip: false
keys:
  meeting-api-key: meeting-api-secret-2026
logging:
  level: info
redis:
  address: redis:6379
  password: redis_password
  db: 0
# Webhook-Config: LiveKit sendet egress-events an Backend
# Tier 1.5: ohne diese Config erreicht kein Egress-completed/failed das Backend
# Syntax (offizielle config-sample.yaml): `urls` (Liste), `api_key`. Kein `events`-Feld.
# LiveKit sendet standardm\u00e4ssig alle Webhook-Events (room/participant/track/egress/ingress).
webhook:
  api_key: meeting-api-key
  urls:
    - http://backend:8000/api/v1/livekit/webhooks
