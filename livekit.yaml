port: 7880
rtc:
  # TEST-ONLY: ngrok-Media-Test über ICE/TCP-Fallback.
  # Vor Produktion entfernen und LiveKit wieder normal über UDP/Firewall betreiben.
  tcp_port: 7881
  # TEST-ONLY: LiveKit meldet LIVEKIT_NODE_IP/ngrok-Host an Clients.
  # Vor Produktion entfernen.
  use_external_ip: true
  # TEST-ONLY: UDP-Range bleibt für lokale Teilnehmer aktiv; ngrok-Teilnehmer nutzen tcp_port als Fallback.
  # Vor Produktion entfernen, wenn UDP nicht benötigt wird.
  port_range_start: 7881
  port_range_end: 7890
keys:
  __LIVEKIT_API_KEY__: __LIVEKIT_API_SECRET__
logging:
  level: info
redis:
  address: redis:6379
  password: redis_password
  db: 0
# Webhook-Config: LiveKit sendet egress-events an Backend
# Tier 1.5: ohne diese Config erreicht kein Egress-completed/failed das Backend
# Syntax (offizielle config-sample.yaml): `urls` (Liste), `api_key`. Kein `events`-Feld.
# LiveKit sendet standardm\u00e4ssig alle Webhook-Events (room/participant/track/egress/ingress).
webhook:
  api_key: __LIVEKIT_API_KEY__
  urls:
    - http://backend:8000/api/v1/livekit/webhooks
