name: E2E Tests & Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: docker.io/batnini/meeting-automation-backend

jobs:
  # Job 1: Build backend Docker image and run E2E tests in DEV (docker-compose.e2e.yml)
  build-and-test-dev:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      run: |
        cd backend
        docker build --build-arg SKIP_SENTINEL=true -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

    - name: Run E2E tests in DEV (docker-compose.e2e.yml)
      run: |
        cd backend
        # Bring up test environment — use pre-built image to avoid double build
        BACKEND_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }} \
        docker compose -f ../docker-compose.e2e.yml up -d
        # Wait for backend to be ready
        echo "Waiting for backend on port 8001..."
        for i in {1..60}; do
          if curl -s http://localhost:8001/health > /dev/null; then
            echo "Backend is healthy"
            break
          fi
          sleep 2
        done
        # Run ONLY e2e tests (skip unit/integration); retry flaky tests up to 2 times
        docker compose -f ../docker-compose.e2e.yml exec -T backend pip install pytest pytest-cov pytest-rerunfailures pytest-asyncio
        # Run Alembic migrations before tests
        docker compose -f ../docker-compose.e2e.yml exec -T backend alembic upgrade head
        docker compose -f ../docker-compose.e2e.yml exec -T backend pytest tests/e2e/ -v --tb=short --junitxml=report.xml --reruns 2 --reruns-delay 1
        #docker compose -f ../docker-compose.e2e.yml exec -T backend pytest tests/e2e/ -v --tb=short --junitxml=report.xml --reruns 2 --reruns-delay 1
      env:
        E2E_TEST: "true"

    - name: Archive DEV E2E test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-dev-test-results
        path: |
          backend/report.xml
          backend/coverage.xml

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: batnini
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker image (amd64+arm64 — staging=ARM64, production=AMD64)
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        platforms: linux/amd64,linux/arm64
        push: true
        build-args: SKIP_SENTINEL=true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.IMAGE_NAME }}:latest

    - name: Build + Push Frontend (amd64+arm64)
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          batnini/meeting-automation-frontend:${{ github.sha }}
          batnini/meeting-automation-frontend:latest

  # Job 2: Deploy to Staging and run full E2E tests (only on main branch)
  deploy-staging-and-test:
    runs-on: ubuntu-latest
    needs: build-and-test-dev
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Check Staging Secrets
      run: |
        # Fail fast if staging cluster is not configured
        if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
          echo "❌ KUBE_CONFIG_STAGING secret not configured."
          echo "Required: GitHub → Settings → Environments → staging → Secrets"
          exit 1
        fi

    - name: Configure K8s context for staging
      run: |
        # KUBE_CONFIG_STAGING secret guaranteed by Check Staging Secrets step
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" > kubeconfig-staging
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        
        # Get the first available context (or specify the correct name)
        CONTEXT=$(kubectl config get-contexts -o name | head -1)
        if [ -z "$CONTEXT" ]; then
          echo "❌ No contexts found in kubeconfig"
          exit 1
        fi
        
        echo "Using context: $CONTEXT"
        kubectl config use-context "$CONTEXT"
        
        # Create namespace if not exists
        kubectl get namespace meeting-automation-staging || kubectl apply -f infrastructure/kubernetes/staging/namespace.yaml

    - name: Create/Update Staging Secrets from GitHub Secrets
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # E2E test user credentials (dedicated test user with role 'dg')
        kubectl create secret generic e2e-test-user \
          --namespace meeting-automation-staging \
          --from-literal=E2E_TEST_USER_EMAIL="${{ secrets.STAGING_E2E_USER_EMAIL }}" \
          --from-literal=E2E_TEST_USER_PASSWORD="${{ secrets.STAGING_E2E_USER_PASSWORD }}" \
          --dry-run=client -o yaml | kubectl apply -f -

        # Inject AI service API keys into backend-secrets-staging
        kubectl create secret generic backend-api-keys-staging \
          --namespace meeting-automation-staging \
          --from-literal=MISTRAL_API_KEY="${{ secrets.MISTRAL_API_KEY_STAGING }}" \
          --from-literal=GLADIA_API_KEY="${{ secrets.GLADIA_API_KEY_STAGING }}" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Ensure Docker Hub Pull Secret
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # Create Docker Hub pull secret so k3s can pull images from Docker Hub
        kubectl create secret docker-registry dockerhub-pull-secret \
          --namespace meeting-automation-staging \
          --docker-server=https://index.docker.io/v1/ \
          --docker-username=batnini \
          --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
          --dry-run=client -o yaml | kubectl apply -f -
        # Patch all deployments to use the pull secret
        for deploy in $(kubectl get deploy -n meeting-automation-staging -o name 2>/dev/null); do
          HAS_SECRET=$(kubectl get "$deploy" -n meeting-automation-staging -o jsonpath='{.spec.template.spec.imagePullSecrets[?(@.name=="dockerhub-pull-secret")].name}' 2>/dev/null)
          if [ -z "$HAS_SECRET" ]; then
            kubectl patch "$deploy" -n meeting-automation-staging --type=json \
              -p='[{"op":"add","path":"/spec/template/spec/imagePullSecrets","value":[{"name":"dockerhub-pull-secret"}]}]' 2>&1 || true
          fi
        done
        echo "✅ Docker Hub pull secret ready"

    - name: Cleanup completed pods
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        echo "Cleaning up completed/failed pods to free ephemeral-storage..."
        kubectl delete pods -n meeting-automation-staging --field-selector=status.phase=Succeeded --ignore-not-found 2>&1 || true
        kubectl delete pods -n meeting-automation-staging --field-selector=status.phase=Failed --ignore-not-found 2>&1 || true
        REMAINING=$(kubectl get pods -n meeting-automation-staging --no-headers 2>&1 | grep -v Running | grep -v Pending | wc -l)
        echo "Remaining non-running pods: $REMAINING"

    - name: Fix immutable PVCs if storageClass mismatch
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # PVCs are immutable after creation — kubectl apply cannot change storageClassName.
        # If the YAML storageClass differs from the live PVC, we must delete first.
        # Using --ignore-not-found makes this safe on fresh clusters (no-op).
        # Using storageClass check prevents unnecessary data loss on correct PVCs.
        echo "🔍 Checking PVC storageClasses for immutable field mismatches..."
        NEEDS_REAPPLY=false
        for pvc in postgres-backup-pvc postgres-data-postgres-staging-0; do
          SC=$(kubectl get pvc "$pvc" -n meeting-automation-staging \
            -o jsonpath='{.spec.storageClassName}' 2>/dev/null || echo "none")
          if [ "$SC" = "none" ]; then
            echo "  ✅ PVC $pvc does not exist — will be created by apply"
          elif [ "$SC" != "local-path" ]; then
            echo "  ⚠️  PVC $pvc has wrong storageClass: $SC (expected: local-path) — deleting..."
            kubectl delete pvc "$pvc" -n meeting-automation-staging --ignore-not-found
            NEEDS_REAPPLY=true
          else
            echo "  ✅ PVC $pvc already correct (local-path) — skipping"
          fi
        done
        if [ "$NEEDS_REAPPLY" = "true" ]; then
          echo "⏳ Waiting 5s for PVC cleanup..."
          sleep 5
        fi
        echo "✅ Immutable PVC check complete"

    - name: Deploy All Staging Resources (idempotent)
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # Apply ALL staging YAMLs — idempotent (create or update)
        # Includes: secrets, configmaps, PVCs, deployments, services, network policies
        # NOTE: Resources with hardcoded namespace: kube-system (CronJobs, metrics-server)
        # are excluded from staging/ and applied separately in 'Deploy System CronJobs'
        kubectl apply -f infrastructure/kubernetes/staging/ -n meeting-automation-staging
        # Restart OnlyOffice to pick up ConfigMap changes (initContainer copies at pod startup)
        kubectl rollout restart deployment/onlyoffice-staging -n meeting-automation-staging 2>&1 || echo "Warning: OnlyOffice staging rollout restart failed"
        echo "✅ All staging resources applied"

    - name: Install Longhorn if not present (skip-if-exists)
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        if kubectl get namespace longhorn-system &>/dev/null; then
          echo "✅ longhorn-system namespace already exists — skipping Longhorn install"
        else
          echo "📦 Installing Longhorn v1.12.0 on staging..."
          helm repo add longhorn https://charts.longhorn.io 2>/dev/null || true
          helm repo update
          helm install longhorn longhorn/longhorn \
            --namespace longhorn-system \
            --create-namespace \
            --version 1.12.0 \
            --set defaultSettings.defaultReplicaCount=1 \
            --set defaultSettings.createDefaultDiskLabeledNodes=true \
            --set defaultSettings.defaultClass=false \
            --wait --timeout 10m || echo "⚠️ Warning: Longhorn install failed, continuing deployment"
          echo "✅ Longhorn v1.12.0 installed on staging"
        fi

    - name: Deploy System CronJobs (kube-system + longhorn-system)
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # Apply CronJobs that require non-app namespaces (hardcoded in YAML)
        # These are cluster-level cleanup jobs, moved from staging/ to system/
        # to avoid namespace conflicts with kubectl apply -f .../staging/ -n meeting-automation-staging
        kubectl apply -f infrastructure/kubernetes/system/ephemeral-storage-cleanup-cronjob.yaml -n kube-system
        kubectl apply -f infrastructure/kubernetes/system/pod-garbage-collector-cronjob.yaml -n kube-system
        kubectl apply -f infrastructure/kubernetes/system/longhorn-cleanup-cronjob.yaml -n longhorn-system
        # Metrics-server patch (hostNetwork + port 4443 for OCI VNIC workaround)
        kubectl apply -f infrastructure/kubernetes/system/metrics-server-patch.yaml -n kube-system
        # Prometheus hostNetwork (OCI VNIC workaround — same as metrics-server Phase 189)
        helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
        helm repo update
        helm upgrade kube-prometheus-stack prometheus-community/kube-prometheus-stack \
          -n monitoring --reuse-values \
          --set prometheus.prometheusSpec.hostNetwork=true \
          --set prometheus.prometheusSpec.dnsPolicy=ClusterFirstWithHostNet \
          --set prometheus.service.port=9090 || echo "⚠️ Warning: Prometheus helm upgrade failed, continuing deployment"
        echo "✅ System CronJobs + metrics-server + Prometheus hostNetwork applied (kube-system + longhorn-system + monitoring)"

    - name: Deploy Backend to Staging
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        # Set the new image tag — update BOTH backend and alembic-migrate init container
        kubectl set image deployment/backend \
          backend=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          alembic-migrate=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n meeting-automation-staging --record
        # Wait for rollout to complete
        kubectl rollout status deployment/backend -n meeting-automation-staging --timeout=600s

    - name: Deploy Frontend to Staging
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        kubectl set image deployment/frontend \
          frontend=batnini/meeting-automation-frontend:${{ github.sha }} \
          -n meeting-automation-staging --record
        kubectl rollout status deployment/frontend -n meeting-automation-staging --timeout=120s

    - name: Deploy Celery Workers to Staging
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        BACKEND_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
        kubectl set image deployment/celery-worker-staging celery-worker="$BACKEND_IMAGE" -n meeting-automation-staging --record
        kubectl set image deployment/celery-worker-pro-staging celery-worker="$BACKEND_IMAGE" -n meeting-automation-staging --record
        kubectl set image deployment/celery-beat-staging celery-beat="$BACKEND_IMAGE" -n meeting-automation-staging --record
        kubectl rollout status deployment/celery-worker-staging -n meeting-automation-staging --timeout=300s
        kubectl rollout status deployment/celery-worker-pro-staging -n meeting-automation-staging --timeout=300s
        kubectl rollout status deployment/celery-beat-staging -n meeting-automation-staging --timeout=120s

    - name: Import n8n Workflows to Staging (idempotent)
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        echo "=== Import n8n workflows ==="
        N8N_POD=$(kubectl get pods -n meeting-automation-staging -l app=n8n-staging -o jsonpath='{.items[0].metadata.name}')
        WORKFLOW_COUNT=$(kubectl exec -n meeting-automation-staging meeting-db-1 -- psql -U postgres -d meeting_db_staging -t -c "SELECT count(*) FROM workflow_entity" 2>/dev/null | tr -d ' ')
        if [ "$WORKFLOW_COUNT" = "0" ]; then
          echo "No workflows found — importing from n8n/workflows/*.json"
          kubectl exec -n meeting-automation-staging $N8N_POD -- mkdir -p /home/node/.n8n/workflows
          for f in n8n/workflows/*.json; do
            name=$(basename $f)
            echo "Importing $name..."
            cat $f | kubectl exec -i -n meeting-automation-staging $N8N_POD -- tee /home/node/.n8n/workflows/$name > /dev/null
            kubectl exec -n meeting-automation-staging $N8N_POD -- n8n import:workflow --input=/home/node/.n8n/workflows/$name 2>&1 | tail -1 || true
          done
          kubectl rollout restart deployment/n8n-staging -n meeting-automation-staging
          echo "✅ n8n workflows imported"
        else
          echo "✅ n8n workflows already exist ($WORKFLOW_COUNT workflows) — skipping import"
        fi

    - name: Validate required AI API keys
      run: |
        if [ -z "${{ secrets.MISTRAL_API_KEY_STAGING }}" ]; then
          echo "❌ MISTRAL_API_KEY_STAGING is not set. Aborting."
          exit 1
        fi
        if [ -z "${{ secrets.GLADIA_API_KEY_STAGING }}" ]; then
          echo "❌ GLADIA_API_KEY_STAGING is not set. Aborting."
          exit 1
        fi
        echo "✅ AI API keys present."

    - name: Ensure E2E Test User Exists in Staging
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        STAGING_URL="https://staging.meeting-automation.com"
        # Wait for backend to be ready (in addition to health check)
        for i in {1..30}; do
          if curl -s -f "$STAGING_URL/health" > /dev/null; then
            echo "Backend is ready"
            break
          fi
          echo "Waiting for backend..."
          sleep 2
        done
        # Try to register the E2E test user (idempotent)
        REGISTER_PAYLOAD=$(jq -n \
          --arg email "${{ secrets.STAGING_E2E_USER_EMAIL }}" \
          --arg password "${{ secrets.STAGING_E2E_USER_PASSWORD }}" \
          --arg name "E2E Tester" \
          '{
            email: $email,
            password: $password,
            full_name: $name,
            company_name: "E2E Tests"
          }')
        echo "Attempting to ensure test user exists..."
        RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$STAGING_URL/api/v1/auth/register" \
          -H "Content-Type: application/json" \
          -d "$REGISTER_PAYLOAD")
        if [ "$RESPONSE" = "201" ] || [ "$RESPONSE" = "200" ]; then
          echo "✅ Test user created or already exists."
        else
          echo "⚠️  Could not create test user (HTTP $RESPONSE). May already exist with different credentials."
        fi

    - name: Wait for Staging Health Endpoint
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        STAGING_URL="https://staging.meeting-automation.com"
        echo "Waiting for $STAGING_URL/health to return 200..."
        for i in {1..60}; do
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" $STAGING_URL/health 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Staging is healthy"
            break
          fi
          echo "Health check returned $STATUS, waiting... (attempt $i)"
          sleep 5
        done
        # Final check
        curl -f $STAGING_URL/health || (echo "Staging health check failed" && exit 1)

    - name: Port-forward + Run E2E Tests against Staging
      shell: bash
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-staging
        export DATABASE_URL="postgresql+asyncpg://meeting_user:meeting_password@localhost:5433/meeting_db_staging"

        # Port-forward DB + Backend + MinIO (same shell, stays alive during tests)
        echo "Starting port-forward for meeting-db-rw, backend, and minio services..."
        kubectl port-forward -n meeting-automation-staging svc/meeting-db-rw 5433:5432 &
        PF_PID_DB=$!
        kubectl port-forward -n meeting-automation-staging svc/backend 8080:8000 &
        PF_PID_BACKEND=$!
        kubectl port-forward -n meeting-automation-staging svc/minio-staging 9002:9000 &
        PF_PID_MINIO=$!
        trap "kill $PF_PID_DB $PF_PID_BACKEND $PF_PID_MINIO 2>/dev/null || true" EXIT

        # Wait for ports to be ready
        for i in {1..30}; do
          if nc -z localhost 5433 && nc -z localhost 8080 && nc -z localhost 9002; then
            echo "Port forwards ready on localhost:5433, localhost:8080, localhost:9002"
            break
          fi
          echo "Waiting for port forwards... (5433: $(nc -z localhost 5433 2>&1 && echo ok || echo wait), 8080: $(nc -z localhost 8080 2>&1 && echo ok || echo wait), 9002: $(nc -z localhost 9002 2>&1 && echo ok || echo wait))"
          sleep 1
        done

        # Run E2E tests
        cd backend
        pip install -q -r requirements.txt -r requirements-dev.txt
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --junitxml=staging-e2e-report.xml \
          -m "e2e and not flaky" \
          --reruns 2 \
          --reruns-delay 1
      env:
        TEST_ENV: staging
        E2E_TEST: "true"
        E2E_TEST_USER_EMAIL: ${{ secrets.STAGING_E2E_USER_EMAIL }}
        E2E_TEST_USER_PASSWORD: ${{ secrets.STAGING_E2E_USER_PASSWORD }}
        E2E_BASE_URL: "http://localhost:8080"
        DATABASE_URL: "postgresql+asyncpg://meeting_user:meeting_password@localhost:5433/meeting_db_staging"
        S3_ENDPOINT: "http://localhost:9002"
        S3_ACCESS_KEY: "minio_user"
        S3_SECRET_KEY: "minio_password"
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        PYTHONHTTPSVERIFY: "0"

    - name: Check Staging E2E Pass Rate Gate (≥95%)
      id: e2e-gate
      run: |
        cd backend
        if [ ! -f staging-e2e-report.xml ]; then
          echo "E2E report not found!"
          exit 1
        fi
        PASSED=$(grep -c 'testcase.*status="passed"' staging-e2e-report.xml || echo 0)
        FAILED=$(grep -c 'testcase.*status="failed"' staging-e2e-report.xml || echo 0)
        SKIPPED=$(grep -c 'testcase.*status="skipped"' staging-e2e-report.xml || echo 0)
        TOTAL=$((PASSED + FAILED))
        echo "E2E Results: PASSED=$PASSED FAILED=$FAILED SKIPPED=$SKIPPED TOTAL=$TOTAL"
        if [ $TOTAL -eq 0 ]; then
          echo "No E2E tests executed!"
          exit 1
        fi
        PASS_RATE=$((PASSED * 100 / TOTAL))
        echo "E2E Pass rate: ${PASS_RATE}%"
        echo "pass_rate=$PASS_RATE" >> $GITHUB_OUTPUT
        if [ $PASS_RATE -lt 95 ]; then
          echo "❌ E2E pass rate below 95% (required for production deployment)."
          echo "failure_reason=low_e2e_pass_rate" >> $GITHUB_OUTPUT
          exit 1
        fi
        echo "✅ E2E pass rate ≥95%. Passing gate."

    - name: Upload Staging test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: staging-e2e-results
        path: |
          backend/staging-e2e-report.xml
          backend/coverage.xml

  # Job 3: Production Deployment (automatic after staging E2E pass)
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging-and-test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Configure K8s context for production
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" > kubeconfig-prod
        export KUBECONFIG=$(pwd)/kubeconfig-prod

        CONTEXT=$(kubectl config get-contexts -o name | head -1)
        if [ -z "$CONTEXT" ]; then
          echo "No contexts found in kubeconfig"
          exit 1
        fi

        echo "Using context: $CONTEXT"
        kubectl config use-context "$CONTEXT"

    - name: Deploy Production ConfigMaps and Non-Immutable Resources
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        # Apply ConfigMaps, Services, NetworkPolicies, Ingress, etc.
        # Excludes: Deployments (handled by kubectl set image), PVCs (immutable), Secrets (managed separately)
        # Only applies files that exist in infrastructure/kubernetes/production/
        for f in infrastructure/kubernetes/production/onlyoffice-custom-config.yaml \
                 infrastructure/kubernetes/production/ingress-prod.yaml \
                 infrastructure/kubernetes/production/network-policies.yaml; do
          if [ -f "$f" ]; then
            echo "Applying $f..."
            kubectl apply -f "$f" -n meeting-automation 2>&1 || echo "Warning: Failed to apply $f"
          fi
        done
        # Restart OnlyOffice to pick up ConfigMap changes (initContainer copies at pod startup)
        kubectl rollout restart deployment/onlyoffice -n meeting-automation 2>&1 || echo "Warning: OnlyOffice rollout restart failed"
        echo "✅ Production ConfigMaps and non-immutable resources applied"

    - name: Deploy to Production
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        kubectl set image deployment/backend \
          backend=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          alembic-migrate=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n meeting-automation --record
        kubectl set image deployment/frontend \
          frontend=batnini/meeting-automation-frontend:${{ github.sha }} \
          -n meeting-automation --record
        kubectl set image deployment/celery-worker \
          celery-worker=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n meeting-automation --record
        kubectl set image deployment/celery-worker-pro \
          celery-worker=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n meeting-automation --record
        kubectl set image deployment/celery-beat \
          celery-beat=${{ env.IMAGE_NAME }}:${{ github.sha }} \
          -n meeting-automation --record
        kubectl rollout status deployment/backend -n meeting-automation --timeout=300s
        kubectl rollout status deployment/frontend -n meeting-automation --timeout=120s
        kubectl rollout status deployment/celery-worker -n meeting-automation --timeout=300s
        kubectl rollout status deployment/celery-worker-pro -n meeting-automation --timeout=300s
        kubectl rollout status deployment/celery-beat -n meeting-automation --timeout=120s

    - name: Deploy System CronJobs to Production (kube-system + longhorn-system)
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        # Apply CronJobs that require non-app namespaces (hardcoded in YAML)
        # These are cluster-level cleanup jobs, separate from app-level resources
        kubectl apply -f infrastructure/kubernetes/system/ephemeral-storage-cleanup-cronjob.yaml -n kube-system
        kubectl apply -f infrastructure/kubernetes/system/pod-garbage-collector-cronjob.yaml -n kube-system
        kubectl apply -f infrastructure/kubernetes/system/longhorn-cleanup-cronjob.yaml -n longhorn-system
        echo "✅ Production System CronJobs applied (kube-system + longhorn-system)"

    - name: Run Production Smoke Tests
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        kubectl port-forward -n meeting-automation svc/backend 18080:8000 &
        sleep 5
        HEALTH=$(curl -sf http://localhost:18080/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
        kill %1 2>/dev/null || true
        if [ "$HEALTH" = "healthy" ]; then
          echo "Production smoke test PASSED"
        else
          echo "Production smoke test FAILED"
          exit 1
        fi

    - name: Rollback on Failure
      if: failure()
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        kubectl rollout undo deployment/backend -n meeting-automation
        kubectl rollout undo deployment/frontend -n meeting-automation
        kubectl rollout undo deployment/celery-worker -n meeting-automation
        kubectl rollout undo deployment/celery-worker-pro -n meeting-automation
        kubectl rollout undo deployment/celery-beat -n meeting-automation
        echo "Rolled back to previous revision"

