name: Backend CI

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    # - name: Lint with flake8
    #   run: |
    #     cd backend
    #     flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
    #     flake8 app --count --max-complexity=10 --max-line-length=127 --statistics
    #
    # - name: Type check with mypy
    #   run: |
    #     cd backend
    #     mypy app
    #
    # TEMPORARY DISABLED for release: See docs/LINT_ISSUES_2026-04-05.md
    # Lint and type checks will be re-enabled after addressing 678 issues.

    - name: Run Alembic migrations
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        cd backend
        PYTHONPATH=. alembic upgrade head

    - name: Run tests with pytest
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        TOTP_ENCRYPTION_KEY: ${{ secrets.TOTP_ENCRYPTION_KEY }}
        SECRET_KEY: ${{ secrets.SECRET_KEY }}
        E2E_TEST: "true"
      run: |
        cd backend
        pytest tests/ --cov=app --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./backend/coverage.xml
        flags: backend

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        cd backend
        docker build -t meeting-automation-backend:${{ github.sha }} .
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: meeting-automation-backend:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'