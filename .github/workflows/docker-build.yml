name: Docker Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Ermöglicht manuelles Triggern

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Debug Secrets (sicher)
      run: |
        echo "=== Secret Check ==="
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
          echo "✅ DOCKERHUB_USERNAME is set"
          echo "Username length: ${#DOCKERHUB_USERNAME}"
        else
          echo "❌ DOCKERHUB_USERNAME is NOT set"
          exit 1
        fi
        
        if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
          echo "✅ DOCKERHUB_TOKEN is set"
          TOKEN_LENGTH=$(echo -n "${{ secrets.DOCKERHUB_TOKEN }}" | wc -c)
          echo "Token length: $TOKEN_LENGTH characters"
        else
          echo "❌ DOCKERHUB_TOKEN is NOT set"
          exit 1
        fi
      env:
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Alternative Login Methode
      run: |
        # Secrets als Environment Variablen
        DOCKER_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
        DOCKER_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
        
        # Konvertiere zu lowercase
        DOCKER_USERNAME=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
        
        echo "Attempting login for user: $DOCKER_USERNAME"
        
        # Login mit heredoc (alternative Methode) (benötigt Docker-Befehl)
        docker login --username "$DOCKER_USERNAME" --password-stdin <<< "$DOCKER_TOKEN"
        
        if [ $? -eq 0 ]; then
          echo "✅ Login successful via direct command"
        else
          echo "❌ Login failed"
          exit 1
        fi
        
    - name: Verify login
      run: |
        echo "=== Docker Info ==="
        docker system info | grep -E "Username|Registry" || true
        
        echo "=== Testing pull ==="
        docker pull hello-world:latest || {
          echo "❌ Pull test failed"
          exit 1
        }
        echo "✅ Pull test successful"
        
    - name: Build and push backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/meeting-automation-backend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/meeting-automation-backend:${{ github.sha }}
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        
    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/meeting-automation-frontend:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/meeting-automation-frontend:${{ github.sha }}
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}