name: '🤖 AI Workflow Monitor'

on:
  workflow_run:
    workflows: ['Backend CI', 'Frontend CI', 'E2E Tests & Deployment Pipeline']
    types: [completed]
  workflow_dispatch:
    inputs:
      workflow_name:
        description: 'Welchen Workflow analysieren?'
        required: false
        type: string

permissions:
  contents: 'read'
  issues: 'write'
  actions: 'read'

jobs:
  analyze_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 'Code auschecken'
        uses: 'actions/checkout@v4'
        with:
          fetch-depth: 0
      
      - name: 'Workflow-Status prüfen'
        id: check_status
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            STATUS="${{ github.event.workflow_run.conclusion }}"
            WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
            WORKFLOW_ID="${{ github.event.workflow_run.id }}"
          else
            STATUS="manual"
            WORKFLOW_NAME="${{ github.event.inputs.workflow_name }}"
            WORKFLOW_ID="manual"
          fi
          
          echo "STATUS=$STATUS" >> $GITHUB_ENV
          echo "WORKFLOW_NAME=$WORKFLOW_NAME" >> $GITHUB_ENV
          echo "WORKFLOW_ID=$WORKFLOW_ID" >> $GITHUB_ENV
      
      - name: 'Workflow-Logs holen (bei Fehler)'
        if: env.STATUS == 'failure'
        run: |
          echo "Fehlerhafter Workflow: ${{ env.WORKFLOW_NAME }}"
          echo "Status: ${{ env.STATUS }}"
          
          # Read workflow config safely
          CONFIG_FILE=".github/workflows/${WORKFLOW_NAME,,}.yml"
          if [[ -f "$CONFIG_FILE" ]]; then
            cat "$CONFIG_FILE" > workflow_config.txt
          else
            echo "Workflow-Datei nicht gefunden" > workflow_config.txt
          fi
      
      - name: 'AI analysiert Workflow'
        id: ai_analysis
        run: |
          # Build prompt safely using jq (avoids heredoc injection from workflow config)
          WORKFLOW_CONFIG=$(cat workflow_config.txt 2>/dev/null || echo "Keine Konfiguration verfügbar")
          
          PROMPT=$(jq -n \
            --arg name "${{ env.WORKFLOW_NAME }}" \
            --arg status "${{ env.STATUS }}" \
            --arg config "$WORKFLOW_CONFIG" \
            "Analysiere diesen CI/CD Workflow und gib eine detaillierte Bewertung:

Workflow Name: \($name)
Status: \($status)

Workflow Konfiguration:
\($config)

Bitte bewerte:
1. **Best Practices**: Entspricht der Workflow den GitHub Actions Best Practices?
2. **Sicherheit**: Gibt es Sicherheitslücken (z.B. hardcoded Secrets, übermäßige Berechtigungen)?
3. **Performance**: Wie kann die Ausführungszeit optimiert werden?
4. **Fehleranfälligkeit**: Welche Schritte könnten häufig fehlschlagen?
5. **Verbesserungsvorschläge**: Konkrete Änderungen mit Code-Beispielen

Antworte strukturiert auf Deutsch.")

          # Build JSON payload safely
          jq -n \
            --arg prompt "$PROMPT" \
            '{
              "model": "z-ai/glm-5.1",
              "messages": [
                {
                  "role": "system",
                  "content": "Du bist ein GitHub Actions und CI/CD Experte. Analysiere Workflows kritisch und gib praxisnahe Verbesserungen."
                },
                {
                  "role": "user",
                  "content": $prompt
                }
              ],
              "temperature": 0.7,
              "max_tokens": 2500
            }' > payload.json
          
          RESPONSE=$(curl -s -X POST "https://integrate.api.nvidia.com/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.NVIDIA_API_KEY }}" \
            -d @payload.json)
          
          AI_ANALYSIS=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          echo "AI_ANALYSIS<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_ANALYSIS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: 'Issue erstellen/aktualisieren'
        uses: 'actions/github-script@v7'
        env:
          ANALYSIS: ${{ steps.ai_analysis.outputs.AI_ANALYSIS }}
          STATUS: ${{ env.STATUS }}
          WORKFLOW_NAME: ${{ env.WORKFLOW_NAME }}
        with:
          script: |
            const analysis = process.env.ANALYSIS;
            const status = process.env.STATUS;
            const workflowName = process.env.WORKFLOW_NAME;
            const isFailure = status === 'failure';
            
            const title = isFailure 
              ? `🚨 CI/CD Alert: ${workflowName} fehlgeschlagen`
              : `📊 Workflow Analyse: ${workflowName}`;
            
            let body = `## 🤖 AI Workflow Analyse\n\n`;
            body += `**Workflow:** ${workflowName}\n`;
            body += `**Status:** ${status}\n\n`;
            body += `---\n\n`;
            body += `${analysis}\n\n`;
            
            if (isFailure) {
              body += `### 🔧 Sofortmaßnahmen\n`;
              body += `1. Prüfe die Logs des fehlgeschlagenen Workflows\n`;
              body += `2. Führe den Workflow manuell neu aus: \`Actions → ${workflowName} → Re-run jobs\`\n`;
              body += `3. Implementiere die Verbesserungsvorschläge oben\n`;
            }
            
            body += `\n---\n*🤖 Analyse von NVIDIA GLM-5.1*`;
            
            // Prüfe ob bereits ein Issue existiert
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ai-workflow-analysis',
              state: 'open'
            });
            
            const existingIssue = issues.find(issue => 
              issue.title.includes(workflowName)
            );
            
            if (existingIssue && isFailure) {
              // Aktualisiere bestehendes Issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 **Update ${new Date().toLocaleString()}**\n\n${analysis}`
              });
            } else if (isFailure || status === 'manual') {
              // Neues Issue erstellen
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ai-workflow-analysis', isFailure ? 'bug' : 'enhancement']
              });
            }
