name: '🔀 Gemini Dispatcher'

on:
  issue_comment:
    types: [created]

jobs:
  dispatch:
    if: |
      startsWith(github.event.comment.body, '/gemini-') &&
      github.event.comment.author_association == 'OWNER' ||
      github.event.comment.author_association == 'MEMBER' ||
      github.event.comment.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: ${{ steps.parse.outputs.command }}
      args: ${{ steps.parse.outputs.args }}

    steps:
      - name: 'Parse command from comment'
        id: 'parse'
        run: |
          body="${{ github.event.comment.body }}"
          command=$(echo "$body" | awk '{print $1}')
          args=$(echo "$body" | sed -E "s/^\S+\s*//")
          
          echo "command=$command" >> $GITHUB_OUTPUT
          echo "args=$args" >> $GITHUB_OUTPUT
          
          echo "Parsed command: $command"
          echo "Parsed args: $args"

      - name: 'Acknowledge request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 Hi @${context.actor}, I've received your command `${{ steps.parse.outputs.command }}` and I'm starting the process. You can track progress [in the logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.`
            });
  
  plan:
    needs: dispatch
    if: needs.dispatch.outputs.command == '/gemini-plan'
    permissions:
      contents: 'write'
      issues: 'write'
      pull-requests: 'write'
      id-token: 'write'
    uses: ./.github/workflows/gemini-plan-execute.yml
    secrets: inherit
    with:
      additional_context: ${{ needs.dispatch.outputs.args }}

  review:
    needs: dispatch
    if: needs.dispatch.outputs.command == '/gemini-review'
    permissions:
      contents: 'read'
      pull-requests: 'write'
    uses: ./.github/workflows/gemini-review.yml
    secrets: inherit
    with:
      additional_context: ${{ needs.dispatch.outputs.args }}

  triage:
    needs: dispatch
    if: needs.dispatch.outputs.command == '/gemini-triage'
    uses: ./.github/workflows/gemini-triage.yml
    secrets: inherit
    with:
      additional_context: ${{ needs.dispatch.outputs.args }}
