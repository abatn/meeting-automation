name: '🔀 Gemini Dispatch'

on:
  issue_comment:
    types:
      - 'created'

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    if: |-
      github.event.sender.type == 'User' &&
      startsWith(github.event.comment.body, '/gemini-') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      issues: 'write'
      pull-requests: 'write'
    outputs:
      command: '${{ steps.extract_command.outputs.command }}'
      additional_context: '${{ steps.extract_command.outputs.additional_context }}'
    steps:
      - name: 'Extract command'
        id: 'extract_command'
        uses: 'actions/github-script@v7'
        with:
          script: |
            const body = context.payload.comment.body;
            const command = body.split(/\s+/)[0].substring(1);
            const additionalContext = body.replace(/^\/\w+\s*/, '').trim();
            core.setOutput('command', command);
            core.setOutput('additional_context', additionalContext);

  plan-execute:
    needs: 'dispatch'
    if: |-
      needs.dispatch.outputs.command == 'gemini-plan'
    uses: './.github/workflows/gemini-plan-execute.yml'
    secrets: 'inherit'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
