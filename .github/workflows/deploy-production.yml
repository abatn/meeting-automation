name: Deploy Production

on:
  # NUR manuell — kein automatischer Trigger!
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image Tag (SHA oder latest)'
        required: true
        type: string
      confirm:
        description: 'Type "yes" to confirm production deploy'
        required: true
        type: string

jobs:
  # ============================================
  # PRE-FLIGHT: Confirmation Check
  # ============================================
  pre-flight:
    runs-on: ubuntu-latest
    steps:
    - name: Validate confirmation
      run: |
        if [ "${{ inputs.confirm }}" != "yes" ]; then
          echo "❌ Production deploy not confirmed. Aborting."
          exit 1
        fi
        echo "✅ Production deploy confirmed with tag: ${{ inputs.image_tag }}"

  # ============================================
  # PRE-DEPLOY BACKUP: Velero Backup
  # ============================================
  pre-deploy-backup:
    runs-on: ubuntu-latest
    needs: pre-flight
    environment: production
    
    steps:
    - name: Configure K8s context for production
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" > kubeconfig-prod
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        
        # Get the first available context
        CONTEXT=$(kubectl config get-contexts -o name | head -1)
        if [ -z "$CONTEXT" ]; then
          echo "❌ No contexts found in kubeconfig"
          exit 1
        fi
        
        echo "Using context: $CONTEXT"
        kubectl config use-context "$CONTEXT"

    - name: Install Velero CLI
      run: |
        VELERO_VERSION="v1.18.1"
        echo "Installing Velero CLI ${VELERO_VERSION}..."
        curl -fsSL "https://github.com/vmware-tanzu/velero/releases/download/${VELERO_VERSION}/velero-${VELERO_VERSION}-linux-amd64.tar.gz" | tar -xz
        sudo mv "velero-${VELERO_VERSION}-linux-amd64/velero" /usr/local/bin/velero
        rm -rf "velero-${VELERO_VERSION}-linux-amd64"
        velero version --client-only
        echo "✅ Velero CLI installed"

    - name: Velero Pre-Deploy Backup
      run: |
        export KUBECONFIG=$(pwd)/kubeconfig-prod
        
        echo "=== Creating Velero pre-deploy backup ==="
        echo "Git SHA: ${{ github.sha }}"
        echo "Image Tag: ${{ inputs.image_tag }}"
        
        # Check if Velero is available
        if ! kubectl get deployment velero -n velero &>/dev/null; then
          echo "⚠️ Velero not installed — skipping backup"
          exit 0
        fi
        
        # Check if BSL is available
        BSL_STATUS=$(kubectl get backupstoragelocations.velero.io -n velero -o jsonpath='{.items[0].status.phase}' 2>/dev/null || echo "Unavailable")
        if [ "$BSL_STATUS" != "Available" ]; then
          echo "⚠️ BSL status: $BSL_STATUS — skipping backup"
          exit 0
        fi
        
        # Create backup with git SHA as name
        BACKUP_NAME="pre-deploy-$(echo ${{ github.sha }} | head -c 8)-$(date +%Y%m%d-%H%M%S)"
        echo "Creating backup: $BACKUP_NAME"
        
        velero backup create "$BACKUP_NAME" \
          --include-namespaces=meeting-automation \
          --ttl=336h \
          --wait
        
        # Verify backup
        BACKUP_STATUS=$(kubectl get backups.velero.io "$BACKUP_NAME" -n velero -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
        ITEMS=$(kubectl get backups.velero.io "$BACKUP_NAME" -n velero -o jsonpath='{.status.progress.itemsBackedUp}' 2>/dev/null || echo "0")
        ERRORS=$(kubectl get backups.velero.io "$BACKUP_NAME" -n velero -o jsonpath='{.status.errors}' 2>/dev/null || echo "0")
        
        echo "Backup Status: $BACKUP_STATUS"
        echo "Items: $ITEMS"
        echo "Errors: $ERRORS"
        
        if [ "$BACKUP_STATUS" = "Completed" ]; then
          echo "✅ Velero backup created successfully: $BACKUP_NAME"
        elif [ "$BACKUP_STATUS" = "PartiallyFailed" ] && [ "$ERRORS" = "0" ]; then
          echo "⚠️ Velero backup partially failed (0 errors) — continuing deploy"
        else
          echo "❌ Velero backup failed with $ERRORS errors"
          echo "Deploy will continue (backup is advisory, not blocking)"
        fi

  # ============================================
  # DEPLOY PRODUCTION (mit Approval via Environment)
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    needs: pre-deploy-backup
    environment: production
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Copy production manifests to Contabo
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 169.58.83.32
        username: root
        key: ${{ secrets.CONTABO_SSH_KEY }}
        source: "infrastructure/kubernetes/production/"
        target: "/root/production-manifests"
        strip_components: 3

    - name: Copy system manifests to Contabo
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 169.58.83.32
        username: root
        key: ${{ secrets.CONTABO_SSH_KEY }}
        source: "infrastructure/kubernetes/system/"
        target: "/root/production-manifests/system"
        strip_components: 3

    - name: Copy k3s config.yaml to Contabo
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 169.58.83.32
        username: root
        key: ${{ secrets.CONTABO_SSH_KEY }}
        source: "infrastructure/kubernetes/production/k3s-config.yaml"
        target: "/root/production-manifests/k3s-config.yaml"
        strip_components: 4

    - name: Deploy to Contabo Production
      uses: appleboy/ssh-action@v1
      with:
        host: 169.58.83.32
        username: root
        key: ${{ secrets.CONTABO_SSH_KEY }}
        command_timeout: 20m
        script: |
          set -e
          echo "=== Deploying Production (tag: ${{ inputs.image_tag }}) ==="
          
          TAG="${{ inputs.image_tag }}"
          BACKEND_IMAGE="docker.io/batnini/meeting-automation-backend:$TAG"
          FRONTEND_IMAGE="docker.io/batnini/meeting-automation-frontend:$TAG"
          
          # Pull images directly to k3s containerd (no Docker middleware)
          echo "=== Pulling fresh images to k3s containerd ==="
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | k3s ctr images registry login docker.io --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin 2>/dev/null || true

          # Remove cached images to force fresh pull (prevents stale :latest)
          k3s ctr images rm "$BACKEND_IMAGE" 2>/dev/null || true
          k3s ctr images rm "$FRONTEND_IMAGE" 2>/dev/null || true

          k3s ctr images pull "$BACKEND_IMAGE" || {
            echo "Direct pull failed, falling back to docker save"
            docker pull "$BACKEND_IMAGE"
            docker save "$BACKEND_IMAGE" | k3s ctr images import -
            docker image rm "$BACKEND_IMAGE" 2>/dev/null || true
          }
          k3s ctr images pull "$FRONTEND_IMAGE" || {
            echo "Frontend direct pull failed, trying fallback"
            docker pull "$FRONTEND_IMAGE" || echo "Frontend image not available"
            docker save "$FRONTEND_IMAGE" | k3s ctr images import - 2>/dev/null || true
            docker image rm "$FRONTEND_IMAGE" 2>/dev/null || true
          }
          
          # Apply manifests
          echo "=== Applying manifests ==="
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          cd /root/production-manifests
          
          kubectl apply -f namespace.yaml
          # Secrets: Only apply if they don't exist (manual update required for changes)
          for secret in backend-secrets postgres-secrets redis-secrets minio-secrets rabbitmq-secrets livekit-secrets n8n-secrets; do
            kubectl get secret "$secret" -n meeting-automation >/dev/null 2>&1 || \
              kubectl apply -f "${secret}.yaml" -n meeting-automation
          done
          kubectl apply -f backend-config.yaml -f livekit-configmap.yaml -f livekit-egress-configmap.yaml -f frontend-nginx-config.yaml
          kubectl apply -f redis-deployment.yaml -f rabbitmq-statefulset.yaml -f minio-statefulset.yaml
          kubectl apply -f cnpg-cluster.yaml
          kubectl apply -f backend-deployment.yaml -f frontend-deployment.yaml -f onlyoffice-deployment.yaml -f n8n-deployment.yaml
          kubectl apply -f celery-worker-deployment.yaml -f celery-worker-pro-deployment.yaml -f celery-beat-deployment.yaml
          kubectl apply -f network-policies.yaml
          kubectl apply -f ingress-prod.yaml
          kubectl apply -f n8n-ingress.yaml
          
          # ============================================
          # LIVEKIT: Helm-Chart Installation (wie Staging)
          # Vendored Charts unter production/charts/ (kein Repo-Zugriff noetig)
          # ============================================
          echo "=== Deploying LiveKit via Helm (wie Staging) ==="
          # Charts liegen als Tarballs im Repo (infrastructure/kubernetes/production/charts/)
          # und werden via scp-action nach /root/production-manifests/charts/ kopiert.
          # KEIN helm repo add/update noetig - vermeidet Netzwerk-Fehler auf dem Server.
          
          # LiveKit Server via Helm
          echo "--- LiveKit Server ---"
          helm upgrade --install livekit-server /root/production-manifests/charts/livekit-server-1.9.0.tgz \
            -n meeting-automation \
            --values /root/production-manifests/livekit-server-values.yaml \
            --wait --timeout 10m || echo "⚠️ Warning: LiveKit Server Helm upgrade failed"
          
          # hostNetwork Patch fuer LiveKit Server (Helm-Chart rendert hostNetwork nicht aus Values)
          kubectl patch deployment livekit-server -n meeting-automation --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/hostNetwork","value":true},{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirstWithHostNet"}]' 2>/dev/null || true
          kubectl rollout restart deployment/livekit-server -n meeting-automation 2>/dev/null || true
          
          # LiveKit Egress via Helm
          # WICHTIG: Chart heisst 'egress' (NICHT 'livekit-egress') - livekit/livekit-egress existiert nicht!
          echo "--- LiveKit Egress ---"
          helm upgrade --install livekit-egress /root/production-manifests/charts/egress-1.8.4.tgz \
            -n meeting-automation \
            --values /root/production-manifests/egress-values.yaml \
            --wait --timeout 10m || echo "⚠️ Warning: LiveKit Egress Helm upgrade failed"
          
          # hostNetwork + Recreate Strategy Patch fuer LiveKit Egress
          # (Helm-Chart rendert beides nicht aus Values)
          kubectl patch deployment livekit-egress -n meeting-automation --type='json' \
            -p='[{"op":"add","path":"/spec/template/spec/hostNetwork","value":true},{"op":"replace","path":"/spec/template/spec/dnsPolicy","value":"ClusterFirstWithHostNet"},{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]' 2>/dev/null || true
          kubectl rollout restart deployment/livekit-egress -n meeting-automation 2>/dev/null || true
          
          echo "✅ LiveKit deployed via Helm (wie Staging)"
          
          # Install Longhorn if not present (skip-if-exists)
          echo "=== Checking Longhorn ==="
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          if kubectl get namespace longhorn-system &>/dev/null; then
            echo "✅ longhorn-system namespace already exists — skipping Longhorn install"
          else
            echo "📦 Installing Longhorn v1.12.0 on production..."
            helm repo add longhorn https://charts.longhorn.io 2>/dev/null || true
            helm repo update
            helm install longhorn longhorn/longhorn \
              --namespace longhorn-system \
              --create-namespace \
              --version 1.12.0 \
              --set defaultSettings.defaultReplicaCount=1 \
              --set defaultSettings.createDefaultDiskLabeledNodes=true \
              --set defaultSettings.defaultClass=true \
              --set defaultSettings.guaranteedInstanceManagerCPU=200 \
              --wait --timeout 10m || echo "⚠️ Warning: Longhorn install failed, continuing deployment"
            echo "✅ Longhorn v1.12.0 installed on production"
          fi
          
          # Deploy System CronJobs (kube-system + longhorn-system)
          echo "=== Deploying System CronJobs ==="
          
          # longhorn-cleanup CronJob (only if longhorn-system namespace exists)
          if kubectl get namespace longhorn-system &>/dev/null; then
            echo "longhorn-system namespace found — applying longhorn-cleanup CronJob"
            kubectl apply -f /root/production-manifests/system/longhorn-cleanup-cronjob.yaml -n longhorn-system || {
              echo "Warning: longhorn-cleanup CronJob failed (namespace may not have Longhorn installed yet)"
            }
          else
            echo "longhorn-system namespace not found — skipping longhorn-cleanup CronJob"
            echo "To enable: install Longhorn first, then re-run this deployment"
          fi
          
          # Deploy System CronJobs (kube-system)
          kubectl apply -f /root/production-manifests/system/ephemeral-storage-cleanup-cronjob.yaml -n kube-system || echo "Warning: ephemeral-storage-cleanup failed"
          kubectl apply -f /root/production-manifests/system/pod-garbage-collector-cronjob.yaml -n kube-system || echo "Warning: pod-garbage-collector failed"
          
          # Deploy Image-Cleanup (systemd timer)
          echo "=== Deploying Image-Cleanup ==="
          # Copy script to host
          cp /root/production-manifests/system/image-cleanup-script.sh /usr/local/bin/image-cleanup.sh
          chmod +x /usr/local/bin/image-cleanup.sh
          # Copy systemd units
          cp /root/production-manifests/system/image-cleanup.service /etc/systemd/system/
          cp /root/production-manifests/system/image-cleanup.timer /etc/systemd/system/
          # Reload and enable
          systemctl daemon-reload
          systemctl enable image-cleanup.timer
          systemctl start image-cleanup.timer
          echo "✅ Image-Cleanup timer enabled (weekly Sunday 03:00 UTC)"
          
          # Deploy k3s config.yaml (identical to Staging)
          echo "=== Deploying k3s config.yaml ==="
          cp /root/production-manifests/k3s-config.yaml /etc/rancher/k3s/config.yaml
          echo "✅ k3s config.yaml deployed"
          
          # Ensure k3s.service uses --config flag
          if ! grep -q "--config" /etc/systemd/system/k3s.service; then
            echo "Adding --config flag to k3s.service..."
            sed -i 's|ExecStart=/usr/local/bin/k3s \\|ExecStart=/usr/local/bin/k3s \\\n    --config /etc/rancher/k3s/config.yaml|' /etc/systemd/system/k3s.service
            systemctl daemon-reload
            echo "⚠️ k3s.service updated — k3s restart required"
            RESTART_K3S=true
          else
            echo "✅ --config flag already in k3s.service"
            RESTART_K3S=false
          fi
          
          # Deploy with specific tag
          echo "=== Deploying with tag: $TAG ==="
          kubectl set image deployment/backend \
            backend=$BACKEND_IMAGE \
            alembic-migrate=$BACKEND_IMAGE \
            -n meeting-automation --record
          kubectl set image deployment/frontend \
            frontend=$FRONTEND_IMAGE \
            -n meeting-automation --record
          kubectl set image deployment/celery-worker \
            celery-worker=$BACKEND_IMAGE \
            -n meeting-automation --record
          kubectl set image deployment/celery-worker-pro \
            celery-worker=$BACKEND_IMAGE \
            -n meeting-automation --record
          kubectl set image deployment/celery-beat \
            celery-beat=$BACKEND_IMAGE \
            -n meeting-automation --record
          
          # Wait for rollout
          echo "=== Waiting for rollout ==="
          kubectl rollout status deployment/backend -n meeting-automation --timeout=300s || true
          kubectl rollout status deployment/frontend -n meeting-automation --timeout=120s || true
          kubectl rollout status deployment/celery-worker -n meeting-automation --timeout=300s || true
          kubectl rollout status deployment/celery-beat -n meeting-automation --timeout=120s || true
          
          # Import n8n workflows (idempotent: only if DB is empty)
          echo "=== Import n8n workflows ==="
          N8N_POD=$(kubectl get pods -n meeting-automation -l app=n8n -o jsonpath='{.items[0].metadata.name}')
          WORKFLOW_COUNT=$(kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db -t -c "SELECT count(*) FROM workflow_entity" 2>/dev/null | tr -d ' ')
          if [ "$WORKFLOW_COUNT" = "0" ]; then
            echo "No workflows found — importing from n8n/workflows/*.json"
            kubectl exec -n meeting-automation $N8N_POD -- mkdir -p /home/node/.n8n/workflows
            for f in n8n/workflows/*.json; do
              name=$(basename $f)
              echo "Importing $name..."
              cat $f | kubectl exec -i -n meeting-automation $N8N_POD -- tee /home/node/.n8n/workflows/$name > /dev/null
              kubectl exec -n meeting-automation $N8N_POD -- n8n import:workflow --input=/home/node/.n8n/workflows/$name 2>&1 | tail -1 || true
            done
            kubectl rollout restart deployment/n8n -n meeting-automation
            echo "✅ n8n workflows imported"
          else
            echo "✅ n8n workflows already exist ($WORKFLOW_COUNT workflows) — skipping import"
          fi
          
          # Setup n8n owner (idempotent: only if no owner exists)
          echo "=== Setup n8n owner ==="
          OWNER_COUNT=$(kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db -t -c "SELECT count(*) FROM \"user\"" 2>/dev/null | tr -d ' ')
          if [ "$OWNER_COUNT" = "0" ]; then
            echo "No owner found — creating via n8n REST API"
            curl -s -X POST "http://localhost:8080/n8n/rest/owner/setup" \
              -H "Content-Type: application/json" \
              -d '{"email":"batniniabdelkader@yahoo.com","password":"Abdelka15121978!","firstName":"Abdelkader","lastName":"Batnini"}' > /dev/null || echo "⚠️ Owner setup failed"
            echo "✅ n8n owner created"
          else
            echo "✅ n8n owner already exists ($OWNER_COUNT users) — skipping setup"
          fi
          
          # Create n8n SMTP credential (idempotent: only if no SMTP credential exists)
          echo "=== Create n8n SMTP credential ==="
          CRED_COUNT=$(kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db -t -c "SELECT count(*) FROM credentials_entity WHERE type='smtp'" 2>/dev/null | tr -d ' ')
          if [ "$CRED_COUNT" = "0" ]; then
            echo "No SMTP credential — creating via n8n REST API"
            # Login to n8n for session cookie
            curl -s -c /tmp/n8n-cookies.txt -X POST "http://localhost:8080/n8n/rest/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"batniniabdelkader@yahoo.com","password":"Abdelka15121978!"}' > /dev/null
            # Create SMTP credential
            curl -s -b /tmp/n8n-cookies.txt -X POST "http://localhost:8080/n8n/rest/credentials" \
              -H "Content-Type: application/json" \
              -d '{"name":"SMTP account","type":"smtp","data":{"user":"api","password":"4e2fbbb5ef37900bd76094b79a0dbb82","host":"bulk.smtp.mailtrap.io","port":587,"ssl":false}}' | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Created credential: {d.get(\"id\",\"?\")}')" 2>/dev/null || echo "⚠️ Credential creation failed"
            echo "✅ SMTP credential created"
          else
            echo "✅ SMTP credential already exists ($CRED_COUNT credentials) — skipping creation"
          fi
          
          # Update workflow credential references (idempotent: only if old ID exists)
          echo "=== Update workflow credential references ==="
          NEW_CRED_ID=$(kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db -t -c "SELECT id FROM credentials_entity WHERE type='smtp'" 2>/dev/null | tr -d ' ')
          if [ -n "$NEW_CRED_ID" ]; then
            # Check if old ID exists in workflows
            OLD_ID_EXISTS=$(kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db -t -c "SELECT count(*) FROM workflow_entity WHERE nodes::text LIKE '%RsSZHOzIodwgsuSc%'" 2>/dev/null | tr -d ' ')
            if [ "$OLD_ID_EXISTS" != "0" ]; then
              echo "Updating credential references from RsSZHOzIodwgsuSc to $NEW_CRED_ID"
              kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db \
                -c "UPDATE workflow_entity SET nodes = replace(nodes::text, 'RsSZHOzIodwgsuSc', '$NEW_CRED_ID')::jsonb WHERE nodes::text LIKE '%RsSZHOzIodwgsuSc%';" 2>/dev/null || true
              kubectl exec -n meeting-automation meeting-db-1 -- psql -U postgres -d meeting_db \
                -c "UPDATE workflow_history SET nodes = replace(nodes::text, 'RsSZHOzIodwgsuSc', '$NEW_CRED_ID')::jsonb WHERE nodes::text LIKE '%RsSZHOzIodwgsuSc%';" 2>/dev/null || true
              echo "✅ Credential references updated"
            else
              echo "✅ Credential references already up to date — skipping update"
            fi
          else
            echo "⚠️ No SMTP credential found — skipping update"
          fi
          
          # ============================================
          # SMOKE TESTS (isolated — no rollback on failure)
          # Deploy was already successful (set image + rollout).
          # Smoke test verifies health; failure = WARNING, not rollback.
          # ============================================
          echo "=== Smoke Tests ==="
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          SMOKE_PASSED=true

          # Step 1: Verify all deployments are running
          echo "--- Checking deployment status ---"
          for deploy in backend frontend celery-worker celery-worker-pro celery-beat; do
            READY=$(kubectl get deploy "$deploy" -n meeting-automation -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            DESIRED=$(kubectl get deploy "$deploy" -n meeting-automation -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "0")
            if [ "$READY" = "$DESIRED" ] && [ "$READY" != "0" ]; then
              echo "  ✅ $deploy: $READY/$DESIRED ready"
            else
              echo "  ❌ $deploy: $READY/$DESIRED ready"
              SMOKE_PASSED=false
            fi
          done

          # Step 2: Port-forward health check (with zombie cleanup)
          echo "--- Health check via port-forward ---"
          pkill -f "kubectl port-forward.*svc/backend" 2>/dev/null || true
          SMOKE_PORT=$(shuf -i 18000-19000 -n 1)
          kubectl port-forward -n meeting-automation svc/backend ${SMOKE_PORT}:8000 &
          PF_PID=$!
          trap "kill $PF_PID 2>/dev/null || true" EXIT
          sleep 5
          HEALTH=$(curl -sf http://localhost:${SMOKE_PORT}/health 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
          kill $PF_PID 2>/dev/null || true
          trap - EXIT

          if [ "$HEALTH" = "healthy" ]; then
            echo "  ✅ Health endpoint: healthy"
          else
            echo "  ⚠️ Health endpoint returned: '$HEALTH' (non-critical)"
          fi

          # Step 3: Final verdict
          echo "--- Smoke test result ---"
          if [ "$SMOKE_PASSED" = "true" ]; then
            echo "✅ Production smoke test PASSED"
          else
            echo "⚠️ Production smoke test INCONCLUSIVE — deployments may still be starting"
            echo "   Deploy was successful (set image + rollout). Manual verification recommended."
          fi
          
          # Restart k3s if kubelet-arg was added
          if [ "$RESTART_K3S" = "true" ]; then
            echo "=== Restarting k3s for kubelet-arg changes ==="
            systemctl restart k3s
            echo "Waiting 30s for k3s to restart..."
            sleep 30
            # Verify node is ready
            for i in $(seq 1 10); do
              STATUS=$(kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "False")
              if [ "$STATUS" = "True" ]; then
                echo "✅ Node is Ready after k3s restart"
                break
              fi
              echo "Waiting for node to be Ready... ($i/10)"
              sleep 5
            done
          fi
          
          echo "=== Deployment complete ==="
          kubectl get pods -n meeting-automation
