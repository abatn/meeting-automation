name: AI Comment Assistant

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  ai-response:
    if: startsWith(github.event.comment.body, '/ai')
    runs-on: ubuntu-latest

    steps:
      - name: Extract message
        id: extract
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          MESSAGE="${COMMENT_BODY#/ai }"
          # Use environment file for safe multi-line output
          echo "MESSAGE<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call API
        id: call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          USER_MESSAGE: ${{ steps.extract.outputs.MESSAGE }}
        run: |
          # Build JSON payload safely with jq (avoids heredoc injection)
          jq -n \
            --arg model "$AI_MODEL" \
            --arg content "$USER_MESSAGE" \
            '{
              "model": $model,
              "messages": [
                {
                  "role": "user",
                  "content": $content
                }
              ]
            }' > payload.json

          RESPONSE=$(curl -s -X POST "${OPENAI_BASE_URL}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" \
            -d @payload.json)

          AI_MESSAGE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          echo "AI_MESSAGE<<EOF" >> $GITHUB_OUTPUT
          echo "$AI_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post response
        uses: actions/github-script@v7
        env:
          AI_MESSAGE: ${{ steps.call.outputs.AI_MESSAGE }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: process.env.AI_MESSAGE
            });
