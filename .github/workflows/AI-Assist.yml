name: Generate Issue from Prompt

on:
  issue_comment:
    types: [created]

jobs:
  generate-issue:
    if: contains(github.event.comment.body, '/generate-issue')
    runs-on: ubuntu-latest
    steps:
      - name: Extract user input
        id: extract
        run: |
          USER_INPUT="${{ github.event.comment.body }}"
          echo "input=${USER_INPUT#/generate-issue }" >> $GITHUB_OUTPUT

      - name: Call AI Agent (z. B. OpenAI or NVIDIA GLM)
        uses: actions/github-script@v7
        with:
          script: |
            const prompt = `Du bist ein GitHub Issue Generator... (oben stehender Prompt) \n\n Benutzereingabe: ${process.env.USER_INPUT}`;
            // API Call an LLM
            const issueBody = await callLLM(prompt);
            // Issue erstellen
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Feature: " + extractedTitle,
              body: issueBody
            });
