name: '🤖 Gemini AI Assistant'

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: 'write'
  issues: 'write'
  pull-requests: 'write'
  id-token: 'write'

jobs:
  gemini_agent:
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'pull_request' && github.event.action == 'opened') ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/gemini'))
    runs-on: ubuntu-latest
    
    steps:
      - name: 'Checkout Code'
        uses: 'actions/checkout@v4'
        with:
          # Fetch full history to allow analysis of the entire repo
          fetch-depth: 0

      - name: 'Determine Prompt'
        id: determine_prompt
        run: |
          if [[ "${{ github.event_name }}" == "issues" && "${{ github.event.action }}" == "opened" ]]; then
            echo "PROMPT=/gemini-triage" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.action }}" == "opened" ]]; then
            echo "PROMPT=/gemini-review" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "PROMPT=${{ github.event.comment.body }}" >> $GITHUB_ENV
          fi
          
      - name: 'Run Gemini CLI'
        id: 'run_gemini'
        uses: 'google-github-actions/run-gemini-cli@v0'
        env:
          TITLE: '${{ github.event.pull_request.title || github.event.issue.title }}'
          DESCRIPTION: '${{ github.event.pull_request.body || github.event.issue.body }}'
          EVENT_NAME: '${{ github.event_name }}'
          GITHUB_TOKEN: '${{ secrets.GH_TOKEN }}'
          IS_PULL_REQUEST: '${{ !!github.event.pull_request }}'
          ISSUE_NUMBER: '${{ github.event.pull_request.number || github.event.issue.number }}'
          REPOSITORY: '${{ github.repository }}'
        with:
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          prompt: ${{ env.PROMPT }}
          # The settings.toml is now the single source of truth for tool config
          settings: ".github/commands/gemini-plan-execute.toml"
