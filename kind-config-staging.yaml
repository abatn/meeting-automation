kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
    extraMounts:
      - hostPath: /home/opc/meeting-automation/data/postgres
        containerPath: /data/postgres
      - hostPath: /home/opc/meeting-automation/data/minio
        containerPath: /data/minio
