server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Body size limit for file uploads (default: 1m)
  client_max_body_size 100M;

  # Gzip compression
  gzip on;
  gzip_types text/plain application/json application/javascript text/css application/xml;
  gzip_min_length 256;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # WebSocket endpoint (Transcription Progress)
  location /api/v1/websockets/ {
    resolver 127.0.0.11 10.96.0.10 valid=10s;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_read_timeout 86400s;  # 24 hours for WebSocket
    proxy_send_timeout 86400s;
  }

  # OnlyOffice Document Server proxy (Port 8081 nicht von außen erreichbar)
  # DocsAPI lädt Ressourcen über /web-apps/...
  location /web-apps/ {
    proxy_pass http://onlyoffice:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_read_timeout 600s;
  }

  # OnlyOffice Cache (Editor.bin, images, etc.)
  location /cache/ {
    proxy_pass http://onlyoffice:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 600s;
  }

  # OnlyOffice versionierter Redirect-Pfad (/9.3.1-.../web-apps/...)
  location ~ ^/[0-9]+\.[0-9]+\.[0-9]+[-.] {
    proxy_pass http://onlyoffice:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_read_timeout 600s;
  }

  # OnlyOffice Health-Check
  location /healthcheck {
    proxy_pass http://onlyoffice:80;
  }

  # API endpoints
  location /api/ {
    resolver 127.0.0.11 10.96.0.10 valid=10s;
    set $backend_upstream http://backend:8000;
    proxy_pass $backend_upstream;

    # HTTP/1.1 Keepalive (nginx docs: "recommended for keepalive connections")
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Timeouts (nginx docs: "timeout is set only between two successive read operations")
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;  # 5 min for long-running endpoints

    # Buffers (nginx docs: "if response exceeds buffer size, it is considered invalid")
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Headers — $http_host preserves port (e.g. 158.180.18.110:3000)
    # $host strips port → onlyOfficeUrl in pv.py loses :3000 → api.js loads from port 80 → fails
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-ID $http_x_client_id;
  }
}
